<style>
/* Fonts are served from this site (SIL Open Font License, see fonts/): no third-party requests, and they work offline */
@font-face{font-family:"Young Serif";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/young-serif-400.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/atkinson-hyperlegible-400.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/atkinson-hyperlegible-700.woff2) format("woff2")}
:root{
  --bg:oklch(96.5% .012 70); --card:oklch(98.8% .006 75); --ink:oklch(24% .03 45); --muted:oklch(48% .03 50); --line:oklch(89% .02 65);
  --brand:oklch(40% .08 45); --brand-ink:oklch(98.5% .005 75); --soft:oklch(93% .022 70);
  --ok:oklch(48% .1 150); --warn:oklch(55% .13 60); --bad:oklch(50% .16 25); --gold:oklch(62% .14 68);
  --bar:oklch(30% .045 45); --sat:env(safe-area-inset-top);
  --c-coffee:oklch(33% .06 45); --c-water:oklch(46% .07 55); --c-milk:oklch(91% .035 80); --c-foam:oklch(98% .01 85); --c-whip:oklch(68% .1 65);
  --metal:oklch(88% .008 250); --metal-2:oklch(74% .01 250); --water:oklch(80% .07 225); --ice:oklch(95% .025 220); --flame:oklch(70% .18 50); --flame-2:oklch(86% .14 85);
  --radius:14px; --ease:cubic-bezier(.22,1,.36,1);
  --f-display:"Young Serif",Georgia,serif; --f-body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --nav-h:calc(56px + env(safe-area-inset-bottom));
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:oklch(18% .015 50); --card:oklch(22% .018 50); --ink:oklch(93% .015 70); --muted:oklch(72% .025 60); --line:oklch(31% .02 50);
    --brand:oklch(74% .09 60); --brand-ink:oklch(18% .015 50); --soft:oklch(27% .022 50);
    --ok:oklch(72% .12 150); --warn:oklch(76% .12 65); --bad:oklch(70% .14 25); --gold:oklch(80% .13 80);
    --bar:oklch(18% .015 50);
    --c-milk:oklch(86% .03 80); --c-foam:oklch(95% .01 85);
    --metal:oklch(58% .012 250); --metal-2:oklch(45% .012 250); --water:oklch(58% .08 230); --ice:oklch(80% .03 220);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--bg)}
::selection{background:color-mix(in oklch,var(--brand) 28%,transparent)}
input,select{accent-color:var(--brand);caret-color:var(--brand)}
.statusbar{position:fixed;top:0;left:0;right:0;height:var(--sat);background:var(--bar);z-index:40;pointer-events:none}
body{background:var(--bg);color:var(--ink);font:17px/1.47 var(--f-body);padding-top:var(--sat);padding-bottom:calc(var(--nav-h) + 24px);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.has-cta{padding-bottom:calc(var(--nav-h) + 92px)}
body.cooking{padding-bottom:calc(var(--nav-h) + 40px)}
body.cooking header,body.cooking nav.tabs,body.has-cta header,body.sub header{display:none}
header{padding:20px 16px 0;max-width:720px;margin:0 auto}
header h1{margin:0;font:400 28px/1.15 var(--f-display);letter-spacing:-.01em}
header p{margin:4px 0 0;color:var(--muted);font-size:15px;max-width:40ch}
main{max-width:720px;margin:0 auto;padding:0 16px}
button{font:inherit;color:inherit;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
/* Compact controls keep a 44px touch area (Apple HIG) without looking oversized */
.rowbtn,.sclose,.chips button,.apply,.got,.timer button,.lang button,.help{position:relative}
.rowbtn::after,.sclose::after,.chips button::after,.apply::after,.got::after,.timer button::after{content:"";position:absolute;inset:-4px}
.lang button::after{content:"";position:absolute;inset:-4px -2px}
.ic{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.ic.lg{width:24px;height:24px}

/* Bottom nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:4px 12px calc(4px + env(safe-area-inset-bottom));z-index:10}
nav.tabs button{flex:1;max-width:160px;background:none;border:0;color:var(--muted);font-weight:700;font-size:11.5px;letter-spacing:.01em;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:background .2s var(--ease),color .2s var(--ease)}
nav.tabs button.on{color:var(--brand);background:none}
nav.tabs button .ic{width:24px;height:24px}

h2{font:400 21px/1.25 var(--f-display);margin:28px 0 12px}
h2.sm{font-size:18px;margin:24px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:8px 0}

/* Pick */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:10px}
.drink{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;position:relative;transition:border-color .2s var(--ease),transform .15s var(--ease)}
.drink:active{transform:scale(.97)}
.drink svg.cupsvg{width:30px;height:33px;margin-bottom:6px}
.drink b{font-size:16px;line-height:1.25}
.drink small{color:var(--muted);font-size:13.5px;line-height:1.38}
.drink .state{margin-top:auto;padding-top:8px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px}
.drink .made{position:absolute;top:12px;right:12px;font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:3px}
.drink .made .ic{width:15px;height:15px;color:var(--gold);fill:var(--gold);stroke:var(--gold)}
.st-ok{color:var(--ok)} .st-no{color:var(--bad)}
.st-ok .ic,.st-no .ic{width:16px;height:16px;stroke-width:2.4}

/* Setup */
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--brand);font-weight:700;font-size:16px;min-height:44px;padding:0 8px 0 0;margin-top:8px;cursor:pointer}
.hero{display:flex;gap:14px;align-items:center;margin:4px 0 6px}
.hero svg.cupsvg{width:44px;height:48px;flex:0 0 44px}
.hero h2{margin:0}
.hero p{margin:2px 0 0;color:var(--muted);font-size:15px}
.field+.field{margin-top:16px}
.field.row{flex-wrap:nowrap}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lbl-ic{display:flex;align-items:center;gap:8px}
.stepper{display:flex;align-items:center;gap:8px;margin-left:auto}
.stepper button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center}
.stepper output{font:400 24px var(--f-display);min-width:40px;text-align:center}
.seg{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));background:var(--soft);border-radius:11px;padding:2px;gap:2px}
.seg button{border:0;background:none;font-size:15px;line-height:1.15;min-height:40px;padding:6px 4px;border-radius:9px;cursor:pointer;transition:background .2s var(--ease)}
.seg button.on{background:var(--brand);color:var(--brand-ink);font-weight:700}
.seg.five{grid-template-columns:repeat(6,1fr)}
.seg.five button{grid-column:span 2;font-size:14px}
.seg[style*="--n:4"] button{font-size:14px}
@media (max-width:390px){.seg[style*="--n:4"] button,.seg.five button{font-size:13px}}
.seg.five button:nth-child(n+4){grid-column:span 3}
label.lbl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:700}
label.lbl .ic{width:16px;height:16px}
.need{list-style:none;margin:0;padding:0}
.need li{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:9px 0;font-size:16px;border-bottom:1px solid var(--line)}
.need li:last-child{border-bottom:0}
.need li span{color:var(--muted)}
.need li b{font-weight:700;text-align:right}
.note{border-radius:12px;padding:11px 13px;font-size:15px;margin:8px 0}
.n-warn{background:color-mix(in oklch,var(--warn) 14%,var(--bg))}
.n-bad{background:color-mix(in oklch,var(--bad) 13%,var(--bg))}
.n-tip{background:var(--soft)}
.n-last{background:color-mix(in oklch,var(--gold) 16%,var(--bg))}
.note b{display:block;margin-bottom:2px}
.cta{position:fixed;left:0;right:0;bottom:var(--nav-h);padding:12px 16px;background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:9}
.cta button{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:688px;min-height:52px;margin:0 auto;border:0;border-radius:14px;padding:8px 18px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:17px;cursor:pointer;transition:transform .15s var(--ease);text-align:left}
.cta button:active{transform:scale(.98)}
.cta button small{display:block;font-weight:400;font-size:13px;opacity:.85}
.cta button:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}

/* Cook */
.cook-top{position:sticky;top:var(--sat);z-index:5;background:var(--bg);padding:6px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.x{background:none;border:0;color:var(--muted);font-weight:700;font-size:15px;min-height:44px;padding:0 6px 0 0;cursor:pointer;display:flex;align-items:center;gap:4px}
.lang{display:flex;background:var(--soft);border-radius:99px;padding:4px}
.lang button{border:0;background:none;font-weight:700;font-size:13px;letter-spacing:.04em;min-height:36px;min-width:44px;padding:0 12px;border-radius:99px;cursor:pointer;color:var(--muted)}
.lang button.on{background:var(--brand);color:var(--brand-ink)}
.progrow{display:flex;align-items:center;gap:10px;margin:4px 0 20px}
.progrow .pn{font-size:13px;font-weight:700;color:var(--muted)}
.prog{display:flex;gap:4px;flex:1}
.prog i{flex:1;height:4px;border-radius:99px;background:var(--line);transition:background .3s var(--ease)}
.prog i.d{background:var(--brand)}
.prog i.c{background:color-mix(in oklch,var(--brand) 45%,var(--line))}
.count{font-size:15px;font-weight:700;color:var(--ink);text-align:center;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stepcard{animation:in .35s var(--ease)}
.stepcard.back-anim{animation:inb .35s var(--ease)}
@keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes inb{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.stepcard h3{font:400 24px/1.25 var(--f-display);margin:0 0 14px;text-wrap:balance;letter-spacing:-.01em}
.stepcard p{font-size:18px;line-height:1.55;margin:0;max-width:60ch}
.stepcard p strong{font-weight:700}
.tbox{margin-top:20px;display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:var(--radius);padding:10px 12px 10px 14px}
.tbox>.ic{width:24px;height:24px;color:var(--muted)}
.tbox .tv{font:400 26px var(--f-display);font-variant-numeric:tabular-nums;min-width:72px}
.tbox button{border:0;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:15px;border-radius:99px;min-height:44px;padding:0 16px;cursor:pointer;display:flex;align-items:center;gap:6px;margin-left:auto}
.tbox button .ic{width:18px;height:18px}
.tbox.run button{background:none;border:1.5px solid var(--ink);color:var(--ink)}
.tbox.ding{background:color-mix(in oklch,var(--ok) 20%,var(--bg))}
.cook-nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;z-index:10}
.cook-nav button{flex:1;max-width:340px;border-radius:14px;min-height:52px;padding:0 16px;font-weight:700;font-size:17px;cursor:pointer;border:1.5px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s var(--ease)}
.cook-nav button:active{transform:scale(.97)}
.cook-nav .next{flex:2;background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.cook-nav button:disabled{opacity:.35}
.swipe-hint{font-size:13px;color:var(--muted);text-align:center;margin-top:28px}

/* Done + rating */
.done{text-align:center;padding-top:24px}
.done svg.cupsvg{width:56px;height:62px}
.done h3{font:400 24px/1.25 var(--f-display);margin:12px 0 2px}
.done>p{color:var(--muted);margin:0 0 20px}
.rate{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;text-align:left;margin:0 0 14px}
.rate h4{margin:0 0 8px;font-size:17px}
.stars{display:flex;gap:6px;justify-content:center;margin:4px 0 14px}
.stars button{background:none;border:0;padding:6px;cursor:pointer;color:var(--line);transition:transform .15s var(--ease)}
.stars button .ic{width:32px;height:32px;stroke-width:1.5}
.stars button.on{color:var(--gold)}
.stars button.on .ic{fill:var(--gold)}
.stars button:active{transform:scale(1.2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:99px;min-height:40px;padding:0 14px;font-size:15px;cursor:pointer}
.chips button:disabled{opacity:.6}
.chips button.on{border-color:var(--brand);background:var(--soft);font-weight:700}
.advice{margin-top:14px}
.advice .note{text-align:left}
.apply{margin-top:10px;border:1.5px solid var(--brand);background:none;color:var(--brand);border-radius:99px;min-height:40px;padding:0 14px;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.apply .ic{width:16px;height:16px}
.btn{border:0;background:var(--soft);border-radius:12px;min-height:48px;padding:0 16px;font-weight:700;font-size:16px;cursor:pointer;width:100%;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.done .btn{max-width:420px;margin-left:auto;margin-right:auto}

/* Pantry */
.toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);gap:12px}
.toggle:last-child{border-bottom:0}
.toggle>div:first-child{display:flex;gap:12px;align-items:flex-start}
.toggle>div:first-child>.ic{margin-top:2px;color:var(--brand)}
.toggle small{display:block;color:var(--muted);font-size:13.5px;line-height:1.35}
.tag{font-size:14px;font-weight:700;color:var(--ok);white-space:nowrap}
.sw{position:relative;width:51px;height:31px;flex:0 0 51px;cursor:pointer}
.sw::after{content:"";position:absolute;inset:-8px -4px}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:background .2s var(--ease);cursor:pointer}
.sw i:before{content:"";position:absolute;width:27px;height:27px;left:2px;top:2px;background:var(--card);border-radius:50%;transition:transform .2s var(--ease)}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i:before{transform:translateX(20px)}
.sw input:focus-visible+i{outline:2px solid var(--brand);outline-offset:2px}
.toggle select,.toggle input[type=number]{flex:0 0 auto}
input[type=number],select{font:inherit;font-size:16px;min-height:44px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:120px}

/* Learn */
.level{background:var(--brand);color:var(--brand-ink);border-radius:16px;padding:14px 16px;margin-top:16px}
.level .top{display:flex;align-items:center;gap:12px}
.level .badge-ic{width:42px;height:42px;border-radius:50%;background:color-mix(in oklch,var(--brand-ink) 18%,transparent);display:flex;align-items:center;justify-content:center}
.level .badge-ic .ic{width:24px;height:24px}
.level h2{margin:0;font-size:21px;color:inherit}
.level p{margin:0;font-size:13px;color:color-mix(in oklch,var(--brand-ink) 82%,var(--brand))}
.xpbar{height:6px;border-radius:99px;background:color-mix(in oklch,var(--brand-ink) 22%,transparent);margin:14px 0 6px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .6s var(--ease)}
.level .xpt{font-size:13px;color:color-mix(in oklch,var(--brand-ink) 85%,var(--brand));display:flex;justify-content:space-between}
.summary{margin:10px 2px 0;color:var(--muted);font-size:15px}
.summary b{color:var(--ink)}
.lhead{display:flex;align-items:center;justify-content:space-between;margin:28px 0 10px}
.lhead h2{margin:0}
.help{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--brand);font-weight:700;font-size:14px;min-height:44px;cursor:pointer}
.cats{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.cat{display:flex;align-items:center;gap:14px;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 14px;text-align:left;cursor:pointer;width:100%;transition:background .15s var(--ease)}
.cat:last-child{border-bottom:0}
.cat:active{background:var(--soft)}
.cat .ci{color:var(--brand);flex:0 0 auto;display:flex}
.cat .ci .ic{width:24px;height:24px}
.chero{display:flex;gap:12px;align-items:center;margin:4px 0 8px}
.chero>.ic{width:28px;height:28px;color:var(--brand)}
.chero h2{margin:0}
.chero p{margin:0;color:var(--muted);font-size:15px}
.cat .cm{flex:1;min-width:0}
.cat b{display:block;font-size:16px}
.cat small{color:var(--muted);font-size:13px}
.cat .pbr{display:flex;align-items:center;gap:10px;margin-top:8px}
.cat .pb{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.cat .pn{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.cat .pb i{display:block;height:100%;background:var(--ok);border-radius:99px}
.cat>.ic{color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:18px 8px}
.bdg{text-align:center;font-size:12.5px;line-height:1.3}
.bdg .bi{width:44px;height:44px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;background:color-mix(in oklch,var(--gold) 22%,var(--bg));color:color-mix(in oklch,var(--gold) 60%,var(--ink))}
.bdg b{display:block;font-size:13px}
.bdg span{color:var(--muted)}
.bdg.locked .bi{background:var(--soft);color:var(--muted)}
.bdg.locked b{color:var(--muted)}
.log li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.log li:last-child{border-bottom:0}
.log ul{list-style:none;margin:0;padding:0}
.srow{display:inline-flex;gap:1px;vertical-align:-3px;color:var(--gold)}
.srow .ic{width:17px;height:17px;stroke-width:1.6}
.srow .ic.f{fill:currentColor}
.log .s{white-space:nowrap;font-size:15px;color:var(--muted)}
.log small{color:var(--muted);display:block;font-size:13px}
.lesson{border-bottom:1px solid var(--line)}
.lesson:last-child{border-bottom:0}
.lesson>button{width:100%;background:none;border:0;padding:14px 0;display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer;font-size:16px;font-weight:700}
.lesson>button .chk{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 28px}
.lesson>button .chk .ic{width:16px;height:16px;stroke-width:2.6;opacity:0}
.lesson.learned>button .chk{background:var(--ok);border-color:var(--ok);color:var(--brand-ink)}
.lesson.learned>button .chk .ic{opacity:1}
.lesson>button>.ic{margin-left:auto;color:var(--muted);transition:transform .2s var(--ease)}
.lesson.open>button>.ic{transform:rotate(90deg)}
.lesson .body{display:none;padding:0 0 14px 36px;font-size:16px}
.lesson.open .body{display:block}
.lesson .body p{margin:0 0 10px}
.lesson .body ul{margin:0 0 10px;padding-left:20px}
.lesson .body li+li{margin-top:4px}
.got{border:0;background:var(--ok);color:var(--brand-ink);border-radius:99px;min-height:40px;padding:0 16px;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.got .ic{width:16px;height:16px;stroke-width:2.6}
.quiz .q{font:400 19px/1.3 var(--f-display);margin:4px 0 12px}
.quiz .opts{display:grid;gap:8px}
.quiz .opts button{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:48px;padding:10px 14px;text-align:left;font-size:16px;cursor:pointer;display:flex;align-items:center;gap:10px}
.quiz .opts button.right{border-color:var(--ok);background:color-mix(in oklch,var(--ok) 14%,var(--bg));font-weight:700}
.quiz .opts button.wrong{border-color:var(--bad);background:color-mix(in oklch,var(--bad) 12%,var(--bg))}
.quiz .opts button .ic{margin-left:auto;width:20px;height:20px;stroke-width:2.6}
.quiz .why{margin-top:10px;font-size:15px}
.qcount{font-size:13px;font-weight:700;color:var(--muted)}

/* Learn intro: bottom sheet */
.scrim{position:fixed;inset:0;background:oklch(15% .02 45 / .45);z-index:50;opacity:0;transition:opacity .25s var(--ease)}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);border-radius:22px 22px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;transform:translateY(100%);transition:transform .4s var(--ease);box-shadow:0 -10px 40px oklch(0% 0 0 / .18)}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 18px}
.sheet .art{width:52px;height:52px;border-radius:50%;background:var(--soft);color:var(--brand);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.sheet .art .ic{width:28px;height:28px}
.sheet h2{margin:0 0 6px;font-size:22px}
.sheet p{margin:0;font-size:15px;color:var(--muted);max-width:44ch}
.sheet .dots{display:flex;gap:6px;margin:22px 0 4px}
.sheet .dots i{width:8px;height:8px;border-radius:99px;background:var(--line);transition:width .3s var(--ease),background .3s var(--ease)}
.sheet .dots i.on{width:22px;background:var(--brand)}
.sheet .acts{display:flex;gap:10px;margin-top:14px}
.sheet .acts .btn{margin:0}
.sheet .acts .btn:first-child{flex:1}
.sheet .acts .btn.primary{flex:2}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}

.sheet{max-height:calc(100dvh - var(--sat) - 16px);overflow-y:auto;overscroll-behavior:contain;outline:none}
.sclose{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ihead{display:flex;gap:12px;align-items:center;margin:0 44px 14px 0}
.ihead img{width:48px;height:48px;border-radius:11px;flex:0 0 48px;box-shadow:0 2px 8px oklch(0% 0 0 / .15)}
.ihead h2{font-size:20px;margin:0;text-wrap:balance}
.perks{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:6px}
.perks li{display:flex;gap:8px;align-items:flex-start;font-size:15px}
.perks .ic{color:var(--ok);width:18px;height:18px;stroke-width:2.4;margin-top:2px}
.isteps{list-style:none;margin:0 0 8px;padding:0;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius)}
.isteps li{display:flex;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.isteps li:last-child{border-bottom:0}
.isteps .in{width:24px;height:24px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 24px}
.isteps .it{flex:1;font-size:15px;line-height:1.4}
.isteps .ii{color:var(--brand);display:flex;flex:0 0 auto}
.isteps .ii .ic{width:22px;height:22px}
.sheet .lead{margin:0 0 12px;font-size:15px;color:var(--ink)}
.sheet textarea{display:block;width:100%;min-height:92px;margin:12px 0 0;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:15px/1.4 ui-monospace,Menlo,monospace;resize:vertical;caret-color:var(--brand)}
.sheet .err{color:var(--bad);font-weight:700;font-size:15px;margin:8px 0 0}
.rowbtn{flex:0 0 auto;border:1.5px solid var(--brand);background:none;color:var(--brand);border-radius:99px;min-height:36px;padding:0 14px;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.rowbtn .ic{width:18px;height:18px}

/* First-run setup */
.onb{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;padding:var(--sat) 16px env(safe-area-inset-bottom);animation:fadein .25s var(--ease)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.onb-in{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:16px}
.onb-top{display:flex;align-items:center;justify-content:space-between;min-height:52px}
.onb-top .back{margin:0}
.onb .dots{display:flex;gap:6px}
.onb .dots i{width:7px;height:7px;border-radius:99px;background:var(--line);transition:width .3s var(--ease),background .3s var(--ease)}
.onb .dots i.on{width:20px;background:var(--brand)}
.onb-body{flex:1;padding-top:8px}
.onb h1{font:400 26px/1.2 var(--f-display);margin:0 0 6px;text-wrap:balance}
.onb .lead{color:var(--muted);font-size:15px;margin:0 0 4px}
.onb .art{width:56px;height:56px;border-radius:50%;background:var(--soft);color:var(--brand);display:flex;align-items:center;justify-content:center;margin:8px 0 14px}
.onb .art .ic{width:30px;height:30px}
.onb .art.ok{background:color-mix(in oklch,var(--ok) 16%,var(--bg));color:var(--ok)}
.onb .art.ok .ic{stroke-width:2.6}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tile{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:60px;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:border-color .2s var(--ease),background .2s var(--ease)}
.tile b{font-size:16px}
.tile small{font-size:13px;color:var(--muted)}
.tile.on{border-color:var(--brand);background:var(--soft);box-shadow:inset 0 0 0 1px var(--brand)}
.hint{font-size:14px;color:var(--muted);margin:12px 0 0}
.opts-list{display:grid;gap:8px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;min-height:60px}
.opt>.ic{width:26px;height:26px;color:var(--brand)}
.opt span:not(.radio){flex:1}
.opt b{display:block;font-size:16px}
.opt small{display:block;font-size:13.5px;color:var(--muted)}
.opt .radio{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 24px}
.opt .radio .ic{width:14px;height:14px;stroke-width:3}
.opt.on{border-color:var(--brand);background:var(--soft);box-shadow:inset 0 0 0 1px var(--brand)}
.opt.on .radio{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.onb .card{margin-top:16px}
/* a list that is also a card keeps the card's inner padding */
.card.need,.card.log ul{padding-left:16px;padding-right:16px}
.onb-go{margin-top:20px}
.seg.pad{margin:2px 0 10px}
.toggle.eq{border-bottom:0;padding-bottom:6px}

/* Level up */
.nextmove{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;padding:10px 12px;border-radius:12px;border:0;background:color-mix(in oklch,var(--brand-ink) 14%,transparent);color:inherit;text-align:left;cursor:pointer;min-height:48px}
.nextmove span:first-child{flex:1;font-weight:700;font-size:15px}
.nextmove small{display:block;font-weight:400;font-size:12px;opacity:.8}
.nextmove .xp{font-weight:700;font-size:13px;background:var(--gold);color:oklch(22% .03 45);border-radius:99px;padding:5px 12px;white-space:nowrap}
.path{list-style:none;margin:0;padding:0;position:relative}
.path li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;position:relative}
.path li:not(:last-child)::after{content:"";position:absolute;left:17px;top:46px;bottom:-6px;width:2px;background:var(--line)}
.path .pi{width:36px;height:36px;flex:0 0 36px;border-radius:50%;background:var(--soft);color:var(--brand);display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.path .pi .ic{width:20px;height:20px}
.path li>div{flex:1;padding-top:1px}
.path b{display:block;font-size:16px}
.path small{display:block;font-size:13.5px;color:var(--muted);line-height:1.35}
.path small.bonus{color:var(--ink);margin-top:3px}
.path .xp{font-weight:700;font-size:14px;color:var(--brand);background:var(--soft);border-radius:99px;padding:5px 12px;white-space:nowrap;margin-top:6px;text-align:center}
.path .xp small{display:inline;font-size:11px;color:var(--muted);margin-left:2px}
.ladder{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.ladder li{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.ladder li:last-child{border-bottom:0}
.ladder .dot{width:26px;height:26px;flex:0 0 26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted)}
.ladder .dot .ic{width:14px;height:14px;stroke-width:3}
.ladder b{flex:1;font-size:15px}
.ladder li>span:last-child{font-size:13px;color:var(--muted)}
.ladder li.past .dot{background:var(--ok);border-color:var(--ok);color:var(--brand-ink)}
.ladder li.now{background:var(--soft)}
.ladder li.now .dot{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.ladder li.now>span:last-child{color:var(--brand);font-weight:700}

/* Multi-cup rating */
.raters{display:flex;gap:6px;justify-content:center;margin:2px 0 4px}
.raters span{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted)}
.raters span.did{background:var(--ok);border-color:var(--ok);color:var(--brand-ink)}
.raters span.did .ic{width:14px;height:14px;stroke-width:3}
.raters span.now{border-color:var(--brand);color:var(--brand)}
.cups{list-style:none;margin:0 0 8px;padding:0}
.cups li{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.cups li:last-child{border-bottom:0}
.said{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:2px}
.log .s small{font-size:12px;color:var(--muted);margin-left:4px}

/* Rate later */
.nudge{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:0 0 12px;padding:12px 14px;border-radius:var(--radius);border:1px solid color-mix(in oklch,var(--gold) 45%,var(--line));background:color-mix(in oklch,var(--gold) 12%,var(--card));cursor:pointer}
.nudge>.ic:first-child{color:var(--gold);fill:var(--gold);width:22px;height:22px}
.nudge span{flex:1;min-width:0}
.nudge b{display:block;font-size:15px}
.nudge small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.nudge>.ic:last-child{color:var(--muted)}
.log li{align-items:center}
.ihead svg.cupsvg{width:40px;height:44px;flex:0 0 40px}
.ihead p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.rate.rate-flat{border:0;padding:0;margin:0 0 4px;background:none}

/* Floating timer + toast */
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px);background:var(--ink);color:var(--bg);border-radius:99px;padding:10px 12px 10px 16px;display:none;align-items:center;gap:10px;font-weight:700;font-size:17px;box-shadow:0 8px 28px oklch(0% 0 0 / .25);z-index:20;font-variant-numeric:tabular-nums}
.timer.show{display:flex}
.timer.ding{background:var(--ok);color:var(--brand-ink)}
.timer button{background:none;border:1.5px solid currentColor;border-radius:99px;min-height:36px;padding:0 14px;font-weight:700;font-size:14px;cursor:pointer}
body.has-cta .timer{bottom:calc(var(--nav-h) + 96px)}
.toast{position:fixed;top:calc(12px + var(--sat));left:50%;transform:translate(-50%,-12px);opacity:0;visibility:hidden;background:var(--ink);color:var(--bg);border-radius:99px;padding:10px 18px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;z-index:90;transition:transform .4s var(--ease);box-shadow:0 8px 28px oklch(0% 0 0 / .25);white-space:nowrap}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
.toast{transition:transform .35s var(--ease),opacity .25s var(--ease),visibility 0s linear .35s}
.toast.show{transition:transform .35s var(--ease),opacity .25s var(--ease)}
.toast .ic{color:var(--gold);width:20px;height:20px}
@media (prefers-reduced-motion:reduce){.stepcard,.stepcard.back-anim{animation:none}.toast,.xpbar i{transition:none!important}}

/* Step scenes: one small animated illustration per action. Pure SVG + CSS, no images. */
.stage{position:relative;height:132px;margin:0 0 16px;border-radius:var(--radius);background:linear-gradient(to bottom,var(--soft),color-mix(in oklch,var(--soft) 55%,var(--bg)));overflow:hidden}
.stage svg{display:block;width:100%;height:100%}
.stage .ln{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.stage .thin{stroke-width:1.6}
.stage .mt{fill:var(--metal);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.stage .mt2{fill:var(--metal-2);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.stage .gl{fill:color-mix(in oklch,var(--card) 70%,transparent);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.stage .br{fill:var(--brand);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.stage .cof{fill:var(--c-coffee)} .stage .cof2{fill:var(--c-water)} .stage .mk{fill:var(--c-milk)} .stage .fm{fill:var(--c-foam)} .stage .wh{fill:var(--c-whip)}
.stage .wt{fill:var(--water)} .stage .ic3{fill:var(--ice);stroke:var(--ink);stroke-width:1.4}
.stage .fl{fill:var(--flame)} .stage .fl2{fill:var(--flame-2)}
.stage .sg{fill:var(--card);stroke:var(--ink);stroke-width:1.4}
.stage .gr{fill:var(--c-coffee)} .stage .bn{fill:var(--c-coffee);stroke:var(--ink);stroke-width:1}
.stage .counter{stroke:var(--line);stroke-width:3;stroke-linecap:round}
.stage .st{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;opacity:0}
.stage .dash{fill:none;stroke:var(--warn);stroke-width:1.6;stroke-dasharray:3 3}
.stage .gold{fill:var(--gold)}
.stage .ok{fill:none;stroke:var(--ok);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.stage .hd{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.stage .no{fill:none;stroke:var(--bad);stroke-width:2.4;stroke-linecap:round}
.stage [class*="a-"]{transform-box:fill-box}
/* motion vocabulary */
.stage .a-steam{animation:sc-steam 2.4s ease-out infinite}
.stage .a-flick{transform-origin:50% 100%;animation:sc-flick .5s ease-in-out infinite alternate}
.stage .a-shake{animation:sc-shake .18s linear infinite}
.stage .a-pulse{animation:sc-pulse 1.4s ease-in-out infinite}
.stage .a-spin{transform-origin:50% 50%;animation:sc-spin 1.2s linear infinite}
.stage .a-spinf{transform-origin:50% 50%;animation:sc-spin .35s linear infinite}
.stage .a-drop{animation:sc-drop 1.8s cubic-bezier(.5,0,.75,0) infinite}
.stage .a-fall{animation:sc-fall .9s linear infinite}
.stage .a-fill{transform-origin:50% 100%;animation:sc-fill 3.2s var(--ease) infinite}
.stage .a-fill1{transform-origin:50% 100%;animation:sc-fill1 .9s var(--ease) both}
.stage .a-bob{transform-origin:50% 50%;animation:sc-bob 1.6s ease-in-out infinite}
.stage .a-rise{animation:sc-rise 1.6s ease-in infinite}
.stage .a-stream{animation:sc-stream 3.2s linear infinite}
.stage .a-wob{transform-origin:50% 100%;animation:sc-wob 1.2s ease-in-out infinite}
.stage .a-tilt{transform-origin:100% 100%;animation:sc-tilt 3.2s var(--ease) infinite}
.stage .a-swipe{animation:sc-swipe 3.2s var(--ease) infinite}
.stage .a-orbit{animation:sc-orbit 1s linear infinite}
.stage .a-tint{animation:sc-tint 4s ease-in-out infinite alternate}
.stage .a-pop{transform-origin:50% 100%;animation:sc-pop .6s var(--ease) both}
.stage .a-twinkle{transform-origin:50% 50%;animation:sc-twinkle 1.8s ease-in-out infinite}
.stage .a-cool{animation:sc-cool 2s ease-in-out infinite}
.stage .a-gush{animation:sc-gush 2.6s ease-in infinite}
.stage .a-buzz{animation:sc-buzz 1.4s linear infinite}
.stage .a-crank{animation:sc-spin 1.6s linear infinite}
.stage .a-whisk{transform-origin:50% 50%;animation:sc-whisk .16s linear infinite alternate}
.stage .a-drop1{animation:sc-drop1 .9s cubic-bezier(.3,0,.6,1) both}
.stage .a-tip{animation:sc-tip 3.2s var(--ease) infinite}
.stage .d1{animation-delay:.3s}.stage .d2{animation-delay:.6s}.stage .d3{animation-delay:.9s}.stage .d4{animation-delay:1.2s}.stage .d5{animation-delay:1.5s}.stage .d6{animation-delay:1.8s}
/* a running timer speeds the scene up: things are happening right now */
.stage.live .a-flick{animation-duration:.28s}
.stage.live .a-rise{animation-duration:1s}
.stage.live .a-steam{animation-duration:1.6s}
.stage.live::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 2px color-mix(in oklch,var(--ok) 55%,transparent);animation:sc-pulse 1.4s ease-in-out infinite;pointer-events:none}
 @keyframes sc-buzz{0%{transform:translate(0)}4%,12%,20%,28%{transform:translate(-1.6px,.6px)}8%,16%,24%,32%{transform:translate(1.6px,-.6px)}36%,100%{transform:translate(0)}}
@keyframes sc-whisk{from{transform:scaleX(1)}to{transform:scaleX(.25)}}
@keyframes sc-drop1{0%{opacity:0;transform:translateY(-44px)}60%{opacity:1;transform:translateY(0)}75%{transform:translateY(-3px)}100%{opacity:1;transform:translateY(0)}}
@keyframes sc-tip{0%,10%{transform:rotate(0)}25%,60%{transform:rotate(28deg)}75%,100%{transform:rotate(0)}}
