<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coffee Ghor</title>
<meta name="description" content="Our home coffee guide: pick a drink and how many people, get exact amounts and step-by-step instructions.">
<meta name="theme-color" content="#f7f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a120d" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coffee Ghor">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --bg:oklch(96.5% .012 70); --card:oklch(98.8% .006 75); --ink:oklch(24% .03 45); --muted:oklch(48% .03 50); --line:oklch(89% .02 65);
  --brand:oklch(40% .08 45); --brand-ink:oklch(98.5% .005 75); --soft:oklch(93% .022 70);
  --ok:oklch(48% .1 150); --warn:oklch(55% .13 60); --bad:oklch(50% .16 25); --gold:oklch(72% .14 75);
  --c-coffee:oklch(33% .06 45); --c-water:oklch(46% .07 55); --c-milk:oklch(91% .035 80); --c-foam:oklch(98% .01 85); --c-whip:oklch(68% .1 65);
  --radius:14px; --ease:cubic-bezier(.22,1,.36,1);
  --f-display:"Young Serif",Georgia,serif; --f-body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --nav-h:calc(72px + env(safe-area-inset-bottom));
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:oklch(18% .015 50); --card:oklch(22% .018 50); --ink:oklch(93% .015 70); --muted:oklch(72% .025 60); --line:oklch(31% .02 50);
    --brand:oklch(74% .09 60); --brand-ink:oklch(18% .015 50); --soft:oklch(27% .022 50);
    --ok:oklch(72% .12 150); --warn:oklch(76% .12 65); --bad:oklch(70% .14 25); --gold:oklch(80% .13 80);
    --c-milk:oklch(86% .03 80); --c-foam:oklch(95% .01 85);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.55 var(--f-body);padding-bottom:calc(var(--nav-h) + 24px);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.has-cta{padding-bottom:calc(var(--nav-h) + 110px)}
body.cooking{padding-bottom:calc(var(--nav-h) + 40px)}
body.cooking header,body.cooking nav.tabs,body.has-cta header,body.sub header{display:none}
header{padding:28px 16px 4px;max-width:720px;margin:0 auto}
header h1{margin:0;font:400 32px/1.1 var(--f-display);letter-spacing:-.01em}
header p{margin:6px 0 0;color:var(--muted);font-size:17px;max-width:36ch}
main{max-width:720px;margin:0 auto;padding:0 16px}
button{font:inherit;color:inherit;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ic{width:22px;height:22px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.ic.lg{width:28px;height:28px}

/* Bottom nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:6px 12px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav.tabs button{flex:1;max-width:180px;background:none;border:0;color:var(--muted);font-weight:700;font-size:14px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:background .2s var(--ease),color .2s var(--ease)}
nav.tabs button.on{color:var(--brand);background:var(--soft)}

h2{font:400 24px/1.2 var(--f-display);margin:32px 0 14px}
h2.sm{font-size:20px;margin:28px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:10px 0}

/* Pick */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:10px}
.drink{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:12px 12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;position:relative;transition:border-color .2s var(--ease),transform .15s var(--ease)}
.drink:active{transform:scale(.97)}
.drink svg.cupsvg{width:40px;height:44px;margin-bottom:6px}
.drink b{font-size:17px;line-height:1.25}
.drink small{color:var(--muted);font-size:15px;line-height:1.4}
.drink .state{margin-top:auto;padding-top:8px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:4px}
.drink .made{position:absolute;top:12px;right:12px;font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:3px}
.drink .made .ic{width:15px;height:15px;color:var(--gold);fill:var(--gold);stroke:var(--gold)}
.st-ok{color:var(--ok)} .st-no{color:var(--bad)}
.st-ok .ic,.st-no .ic{width:16px;height:16px;stroke-width:2.4}

/* Setup */
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--brand);font-weight:700;font-size:16px;padding:10px 0;margin-top:12px;cursor:pointer}
.hero{display:flex;gap:16px;align-items:center;margin:8px 0 6px}
.hero svg.cupsvg{width:64px;height:70px;flex:0 0 64px}
.hero h2{margin:0}
.hero p{margin:4px 0 0;color:var(--muted);font-size:16px}
.field+.field{margin-top:20px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lbl-ic{display:flex;align-items:center;gap:8px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:52px;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center}
.stepper output{font:400 32px var(--f-display);min-width:48px;text-align:center}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;font-size:16px;padding:11px 10px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:background .2s var(--ease)}
.seg button.on{background:var(--brand);color:var(--brand-ink);font-weight:700}
label.lbl{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted);margin-bottom:8px;font-weight:700}
label.lbl .ic{width:18px;height:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px 12px}
.stat .v{font:400 25px/1.15 var(--f-display)}
.stat .k{font-size:15px;color:var(--muted)}
.note{border-radius:12px;padding:12px 14px;font-size:16px;margin:10px 0}
.n-warn{background:color-mix(in oklch,var(--warn) 14%,var(--bg))}
.n-bad{background:color-mix(in oklch,var(--bad) 13%,var(--bg))}
.n-tip{background:var(--soft)}
.n-last{background:color-mix(in oklch,var(--gold) 16%,var(--bg))}
.note b{display:block;margin-bottom:2px}
.cta{position:fixed;left:0;right:0;bottom:var(--nav-h);padding:12px 16px;background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:9}
.cta button{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;max-width:688px;margin:0 auto;border:0;border-radius:14px;padding:15px 18px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:19px;cursor:pointer;transition:transform .15s var(--ease);text-align:left}
.cta button:active{transform:scale(.98)}
.cta button small{display:block;font-weight:400;font-size:14px;opacity:.85}
.cta button:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}

/* Cook */
.cook-top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.x{background:none;border:0;color:var(--muted);font-weight:700;font-size:16px;padding:10px 4px;cursor:pointer;display:flex;align-items:center;gap:4px}
.lang{display:flex;background:var(--soft);border-radius:99px;padding:3px}
.lang button{border:0;background:none;font-weight:700;font-size:14px;letter-spacing:.04em;padding:7px 14px;border-radius:99px;cursor:pointer;color:var(--muted)}
.lang button.on{background:var(--brand);color:var(--brand-ink)}
.prog{display:flex;gap:4px;margin:4px 0 22px}
.prog i{flex:1;height:6px;border-radius:99px;background:var(--line);transition:background .3s var(--ease)}
.prog i.d{background:var(--brand)}
.prog i.c{background:color-mix(in oklch,var(--brand) 45%,var(--line))}
.count{font-size:15px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.drinkname{font-size:15px;color:var(--muted);margin-bottom:6px}
.stepcard{animation:in .35s var(--ease)}
.stepcard.back-anim{animation:inb .35s var(--ease)}
@keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes inb{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.stepcard h3{font:400 30px/1.2 var(--f-display);margin:6px 0 14px;text-wrap:balance}
.stepcard p{font-size:20px;line-height:1.6;margin:0;max-width:60ch}
.stepcard p strong{font-weight:700}
.tbox{margin-top:24px;display:flex;align-items:center;gap:16px;background:var(--soft);border-radius:var(--radius);padding:14px 16px}
.tbox>.ic{width:30px;height:30px;color:var(--muted)}
.tbox .tv{font:400 34px var(--f-display);font-variant-numeric:tabular-nums;min-width:90px}
.tbox button{border:0;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:16px;border-radius:99px;padding:12px 18px;cursor:pointer;display:flex;align-items:center;gap:6px;margin-left:auto}
.tbox button .ic{width:18px;height:18px}
.tbox.run button{background:none;border:1.5px solid var(--ink);color:var(--ink)}
.tbox.ding{background:color-mix(in oklch,var(--ok) 20%,var(--bg))}
.cook-nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;z-index:10}
.cook-nav button{flex:1;max-width:340px;border-radius:14px;padding:16px;font-weight:700;font-size:19px;cursor:pointer;border:1.5px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s var(--ease)}
.cook-nav button:active{transform:scale(.97)}
.cook-nav .next{flex:2;background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.cook-nav button:disabled{opacity:.35}
.swipe-hint{font-size:14px;color:var(--muted);text-align:center;margin-top:28px}

/* Done + rating */
.done{text-align:center;padding-top:32px}
.done svg.cupsvg{width:84px;height:92px}
.done h3{font:400 30px/1.2 var(--f-display);margin:14px 0 4px}
.done>p{color:var(--muted);margin:0 0 20px}
.rate{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;text-align:left;margin:0 0 14px}
.rate h4{margin:0 0 10px;font-size:18px}
.stars{display:flex;gap:6px;justify-content:center;margin:4px 0 14px}
.stars button{background:none;border:0;padding:4px;cursor:pointer;color:var(--line);transition:transform .15s var(--ease)}
.stars button .ic{width:40px;height:40px;stroke-width:1.5}
.stars button.on{color:var(--gold)}
.stars button.on .ic{fill:var(--gold)}
.stars button:active{transform:scale(1.2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:9px 14px;font-size:15px;cursor:pointer}
.chips button.on{border-color:var(--brand);background:var(--soft);font-weight:700}
.advice{margin-top:14px}
.advice .note{text-align:left}
.apply{margin-top:8px;border:1.5px solid var(--brand);background:none;color:var(--brand);border-radius:99px;padding:7px 14px;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.apply .ic{width:16px;height:16px}
.btn{border:0;background:var(--soft);border-radius:12px;padding:15px 16px;font-weight:700;font-size:17px;cursor:pointer;width:100%;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.done .btn{max-width:420px;margin-left:auto;margin-right:auto}

/* Pantry */
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}
.toggle:last-child{border-bottom:0}
.toggle>div:first-child{display:flex;gap:12px;align-items:flex-start}
.toggle>div:first-child>.ic{margin-top:2px;color:var(--brand)}
.toggle small{display:block;color:var(--muted);font-size:15px}
.tag{font-size:15px;font-weight:700;color:var(--ok);white-space:nowrap}
.sw{position:relative;width:52px;height:32px;flex:0 0 52px}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:background .2s var(--ease);cursor:pointer}
.sw i:before{content:"";position:absolute;width:26px;height:26px;left:3px;top:3px;background:var(--card);border-radius:50%;transition:transform .2s var(--ease)}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i:before{transform:translateX(20px)}
.sw input:focus-visible+i{outline:2px solid var(--brand);outline-offset:2px}
input[type=number],select{font:inherit;font-size:17px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:120px}

/* Learn */
.level{background:var(--brand);color:var(--brand-ink);border-radius:18px;padding:18px;margin-top:20px}
.level .top{display:flex;align-items:center;gap:12px}
.level .badge-ic{width:52px;height:52px;border-radius:50%;background:color-mix(in oklch,var(--brand-ink) 18%,transparent);display:flex;align-items:center;justify-content:center}
.level .badge-ic .ic{width:30px;height:30px}
.level small{opacity:.8;font-size:14px;display:block}
.level b{font:400 24px/1.2 var(--f-display)}
.xpbar{height:10px;border-radius:99px;background:color-mix(in oklch,var(--brand-ink) 22%,transparent);margin:14px 0 6px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .6s var(--ease)}
.level .xpt{font-size:14px;opacity:.85;display:flex;justify-content:space-between}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mini div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.mini b{font:400 22px var(--f-display);display:block}
.mini span{font-size:13px;color:var(--muted)}
.cats{display:grid;gap:10px}
.cat{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;text-align:left;cursor:pointer;width:100%;transition:transform .15s var(--ease)}
.cat:active{transform:scale(.98)}
.cat .ci{width:46px;height:46px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--brand);flex:0 0 46px}
.cat .ci .ic{width:26px;height:26px}
.cat .cm{flex:1;min-width:0}
.cat b{display:block;font-size:17px}
.cat small{color:var(--muted);font-size:14px}
.cat .pbr{display:flex;align-items:center;gap:10px;margin-top:8px}
.cat .pb{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.cat .pn{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.cat .pb i{display:block;height:100%;background:var(--ok);border-radius:99px}
.cat>.ic{color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.bdg{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 8px;text-align:center;font-size:13px;line-height:1.3}
.bdg .bi{width:44px;height:44px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;background:color-mix(in oklch,var(--gold) 22%,var(--bg));color:color-mix(in oklch,var(--gold) 60%,var(--ink))}
.bdg b{display:block;font-size:14px}
.bdg span{color:var(--muted)}
.bdg.locked .bi{background:var(--soft);color:var(--muted)}
.bdg.locked b{color:var(--muted)}
.log li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px}
.log li:last-child{border-bottom:0}
.log ul{list-style:none;margin:0;padding:0}
.log .s{color:var(--gold);white-space:nowrap;letter-spacing:1px}
.log small{color:var(--muted);display:block;font-size:14px}
.lesson{border-bottom:1px solid var(--line)}
.lesson:last-child{border-bottom:0}
.lesson>button{width:100%;background:none;border:0;padding:14px 0;display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer;font-size:17px;font-weight:700}
.lesson>button .chk{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 28px}
.lesson>button .chk .ic{width:16px;height:16px;stroke-width:2.6;opacity:0}
.lesson.learned>button .chk{background:var(--ok);border-color:var(--ok);color:var(--brand-ink)}
.lesson.learned>button .chk .ic{opacity:1}
.lesson>button>.ic{margin-left:auto;color:var(--muted);transition:transform .2s var(--ease)}
.lesson.open>button>.ic{transform:rotate(90deg)}
.lesson .body{display:none;padding:0 0 16px 40px;font-size:17px}
.lesson.open .body{display:block}
.lesson .body p{margin:0 0 10px}
.lesson .body ul{margin:0 0 10px;padding-left:20px}
.lesson .body li+li{margin-top:4px}
.got{border:0;background:var(--ok);color:var(--brand-ink);border-radius:99px;padding:9px 16px;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.got .ic{width:16px;height:16px;stroke-width:2.6}
.quiz .q{font:400 22px/1.3 var(--f-display);margin:4px 0 14px}
.quiz .opts{display:grid;gap:8px}
.quiz .opts button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:14px;text-align:left;font-size:17px;cursor:pointer;display:flex;align-items:center;gap:10px}
.quiz .opts button.right{border-color:var(--ok);background:color-mix(in oklch,var(--ok) 14%,var(--bg));font-weight:700}
.quiz .opts button.wrong{border-color:var(--bad);background:color-mix(in oklch,var(--bad) 12%,var(--bg))}
.quiz .opts button .ic{margin-left:auto;width:20px;height:20px;stroke-width:2.6}
.quiz .why{margin-top:12px;font-size:16px}
.qcount{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

/* Floating timer + toast */
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px);background:var(--ink);color:var(--bg);border-radius:99px;padding:10px 12px 10px 16px;display:none;align-items:center;gap:10px;font-weight:700;font-size:19px;box-shadow:0 8px 28px oklch(0% 0 0 / .25);z-index:20;font-variant-numeric:tabular-nums}
.timer.show{display:flex}
.timer.ding{background:var(--ok);color:var(--brand-ink)}
.timer button{background:none;border:1.5px solid currentColor;border-radius:99px;padding:4px 12px;font-weight:700;font-size:14px;cursor:pointer}
body.has-cta .timer{bottom:calc(var(--nav-h) + 96px)}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-140%);background:var(--ink);color:var(--bg);border-radius:99px;padding:10px 18px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;z-index:30;transition:transform .4s var(--ease);box-shadow:0 8px 28px oklch(0% 0 0 / .25);white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
.toast .ic{color:var(--gold);width:20px;height:20px}
@media (prefers-reduced-motion:reduce){.stepcard,.stepcard.back-anim{animation:none}.toast,.xpbar i{transition:none}}

.muted{color:var(--muted)}
.small{font-size:15px}
.hide{display:none}
footer{text-align:center;margin:32px 0;color:var(--muted);font-size:15px}
</style>
</head>
<body>
<header>
  <h1>Coffee Ghor</h1>

/* ---------- Cup illustration: layers drawn to the recipe's real proportions ---------- */
function cup(r, tag=""){
  const W = 40, H = 44, top = 4, bot = 40, inner = bot - top;
  const L = [];
  if (r.instant){ L.push(["--c-milk", r.milk], ["--c-whip", 60]); }
  else {
    if (r.coffee) L.push([r.water ? "--c-water" : "--c-coffee", r.coffee + r.water]);
    if (r.milk){
      const foam = r.froth === "thick" ? .4 : r.froth === "light" ? .15 : 0;
      L.push(["--c-milk", r.milk * (1 - foam)]);
      if (foam) L.push(["--c-foam", r.milk * foam]);
    }
  }
  const total = L.reduce((a, [, v]) => a + v, 0), fill = Math.min(1, total / 260);
  let y = bot, rects = "";
  for (const [c, v] of L){
    const h = inner * fill * v / total; y -= h;
    rects += `<rect x="0" y="${y.toFixed(1)}" width="${W}" height="${h.toFixed(1)}" fill="var(${c})"/>`;
  }
  if (r.ice) rects += [[8, bot - 12], [20, bot - 20], [13, bot - 27]].map(([x, yy]) => `<rect x="${x}" y="${yy}" width="9" height="9" rx="2" fill="none" stroke="var(--card)" stroke-width="1.5" opacity=".8"/>`).join("");
  const path = `M6 ${top} L34 ${top} L31 ${bot} Q30.5 ${bot + 2} 28 ${bot + 2} L12 ${bot + 2} Q9.5 ${bot + 2} 9 ${bot} Z`;
  const id = `c-${r.id}${tag}`;
  return `<svg class="cupsvg" viewBox="0 0 ${W} ${H}" aria-hidden="true"><defs><clipPath id="${id}"><path d="${path}"/></clipPath></defs>
    <g clip-path="url(#${id})">${rects}</g><path d="${path}" fill="none" stroke="var(--muted)" stroke-width="1.5"/></svg>`;
}

/* ---------- Logic ---------- */
const grinderOk = () => S.grinder === "ok";
function coffeeSource(){
  const beansOk = S.inv.beans && grinderOk();
  if (S.source === "beans" && beansOk) return "beans";
  if (S.source === "ground" && S.inv.ground) return "ground";
  if (beansOk) return "beans";
  if (S.inv.ground) return "ground";
  return null;
}
function missing(r){
  const m = [];
  if (r.coffee > 0 && !coffeeSource()){
    if (S.inv.beans && !grinderOk()) m.push("a working grinder (or ground coffee)");
    else m.push("coffee (beans or ground)");
  }
  if (r.instant && !S.inv.instant) m.push("instant coffee");
  if (r.instant && !S.inv.sugar) m.push("sugar (needed for whipping)");
  if (r.milk > 0 && !S.inv.milk) m.push("milk");
  if (r.cocoa && !S.inv.cocoa) m.push("cocoa or chocolate");
  if (r.ice && !S.inv.ice) m.push("ice");
  return m;
}
function plan(r){
  const n = S.people, f = STRENGTH[S.strength];
  const p = { n };
  p.coffeePer = Math.round(r.coffee * f);
  // Mild americano: less coffee, more water, same cup size
  p.waterPer = r.water ? Math.round(r.water + r.coffee - p.coffeePer) : 0;
  p.coffeeTotal = p.coffeePer * n;
  p.yieldPerBrew = Math.round(S.mokaWater * S.yieldPct / 100);
  p.brews = p.coffeeTotal > 0 ? Math.ceil(p.coffeeTotal / p.yieldPerBrew) : 0;
  p.grams = p.brews * S.mokaCoffee;
  p.tbsp = Math.round(p.grams / 5.5);
  p.milkPer = r.milk; p.milkTotal = r.milk * n;
  const cap = r.froth === "thick" ? Math.round(S.pitcher * 0.43) : Math.round(S.pitcher * 0.57); // 350 pitcher: 150 / 200 mark
  p.frothCap = cap;
  p.frothBatches = r.froth !== "none" && p.milkTotal ? Math.ceil(p.milkTotal / cap) : 0;
  p.sugarTsp = r.instant ? 0 : SWEET[S.sweet] * n;
  p.cocoaTbsp = (r.cocoa || 0) * n;
  p.ice = (r.ice || 0) * n;
  p.instantTbsp = r.instant ? Math.max(2, r.instant * n) : 0;
  p.hotWaterTotal = p.waterPer * n;
  // Time: ~8 min per brew + 3 min cool/refill between brews, + 4 min prep
  p.minutes = r.instant ? 6 + Math.ceil(n/2) : p.brews * 8 + Math.max(0, p.brews - 1) * 3 + 4 + (p.frothBatches > 1 ? p.frothBatches - 1 : 0);
  return p;
}

// Steps in the chosen language. Numbers and drink names are shared; only the instructions change.
function buildSteps(r, p, lang){
  const bn = lang === "bn", L = (en, b) => bn ? b : en, R = k => roast()[k][bn ? 1 : 0];
  const I = S.inv, s = [];
  const src = coffeeSource();
  const jug = I.flask ? L("flask","flask") : L("warm jug with a lid","dhakna-wala gorom jug");
  if (r.instant){
    s.push({ t:L("Make the coffee cream","Coffee cream banao"),
      d:L(`In the pitcher: **${p.instantTbsp} tbsp instant coffee**, **${p.instantTbsp} tbsp sugar** and **${p.instantTbsp} tbsp hot water**. Equal amounts of each.`,
          `Pitcher e **${p.instantTbsp} tbsp instant coffee** + **${p.instantTbsp} tbsp chini** + **${p.instantTbsp} tbsp gorom pani** nao. Shob shoman shoman.`) });
    s.push({ t:L("Whip it with the frother","Frother diye whip koro"), timer:180,
      d:L("FAST speed, 2 to 4 minutes. It turns light brown and thick, and won't fall off an upside-down spoon. Take a short break if your hand gets tired.",
          "FAST speed, 2 to 4 min. Rong halka badami hobe, ghono hobe, chamuch ulte dhorle pore jabe na. Hath byatha korle majhe ektu break nao.") });
    s.push({ t:L("Fill the glasses","Glass ready koro"),
      d:L(`**${r.ice} ice cubes** and **${p.milkPer} ml cold milk** in each glass. For extra sweetness, stir a little sugar into the milk first.`,
          `Proti glass e **${r.ice} ta borof**, **${p.milkPer} ml thanda dudh**. Mishti beshi chaile dudhe ektu chini aage gholao.`) });
    s.push({ t:L("Spoon the cream on top","Upore cream dao"),
      d:L("Spoon the whipped coffee over the milk. Stir it in before drinking.","Chamuch diye coffee cream dudher upor rakho. Serve korar shomoy mix kore khabe.") });
    return s;
  }
  const amt = I.scale ? `${p.grams} g` : L(`about ${p.tbsp} tbsp`, `~${p.tbsp} tbsp`);
  const amtNote = I.scale ? L(`About **${p.tbsp} tbsp**.`, `Mot **~${p.tbsp} tbsp**.`) : L(`That's about **${p.grams} g**.`, `Mot **~${p.grams} g**.`);
  if (src === "beans"){
    s.push({ t:L(`Grind ${amt} of beans`,`${amt} beans grind koro`),
      d:L(`${amtNote} ${roast().lbl} roast: short 3-4 second pulses, ${R("pulse")} Shake the grinder between pulses. Aim for the texture of **table salt**. Powder-fine makes moka coffee bitter and can clog the filter.`,
          `${amtNote} ${roast().lbl} roast: 3-4 second er pulse, ${R("pulse")} Majhe majhe grinder jhakao. Target: **table salt er moto** mihi. Powder er moto mihi hole moka te tita hobe ar chhakni bondho hoye jabe.`) });
  } else {
    s.push({ t:L(`Measure ${amt} of ground coffee`,`${amt} guro coffee mepe nao`),
      d:L(`${amtNote} Pre-ground coffee loses flavour fast. Keep the packet sealed tight.`,
          `${amtNote} Pre-ground coffee taratari flavor haray. Packet bhalo kore bondho rakho.`) });
  }
  const hotWater = p.brews * S.mokaWater + p.hotWaterTotal;
  s.push({ t: I.kettle ? L(`Heat ${hotWater} ml water in the kettle`,`Kettle e ${hotWater} ml pani gorom koro`) : L(`Heat ${hotWater} ml water in a pot`,`Patil e ${hotWater} ml pani gorom koro`),
    d:L(`${R("water")} Starting with hot water means the pot spends less time on the stove, so the coffee doesn't burn or turn bitter.`,
        `${R("water")} Moka te gorom pani dile coffee pora/tita hoy na, karon pot chula te kom shomoy thake.`) });
  if ((r.milkMode === "hot" || r.milkMode === "boil") && p.milkTotal){

/* ---------- Progress: XP, levels, badges (all derived from the log, so nothing double-counts) ---------- */
const LEVELS = [[0,"Beginner"],[100,"Apprentice"],[250,"Home Barista"],[500,"Skilled Barista"],[900,"Coffee Master"]];
const dayKey = t => new Date(t).toLocaleDateString("en-CA");
function stats(){
  const log = S.log || [], drinks = new Set(log.map(x => x.d));
  const rated = log.filter(x => x.rating);
  let xp = drinks.size * 30 + Object.keys(S.learned).length * 5;
  for (const x of log) xp += 20 + (x.rating ? 10 : 0) + (x.rating === 5 ? 10 : 0);
  for (const c in S.quiz) xp += (S.quiz[c] || 0) * 15;
  const days = new Set(log.map(x => dayKey(x.t)));
  let streak = 0, d = new Date();
  if (!days.has(dayKey(d))) d.setDate(d.getDate() - 1);
  while (days.has(dayKey(d))){ streak++; d.setDate(d.getDate() - 1); }
  let li = 0; LEVELS.forEach(([min], i) => { if (xp >= min) li = i; });
  const next = LEVELS[li + 1];
  return { xp, cups: log.length, drinks, streak, li, level: LEVELS[li][1], from: LEVELS[li][0], to: next ? next[0] : null, nextName: next ? next[1] : null,
           avg: rated.length ? (rated.reduce((a, x) => a + x.rating, 0) / rated.length) : 0,
           milkCups: log.filter(x => (RECIPES.find(r => r.id === x.d) || {}).milk).length };
}
const BADGES = [
  ["first","cup","First Cup","Finish your first drink", s => s.cups >= 1],
  ["regular","medal","Regular","Make 10 drinks", s => s.cups >= 10],
  ["explorer","compass","Explorer","Try 5 different drinks", s => s.drinks.size >= 5],
  ["menu","trophy","Full Menu","Make all 10 drinks", s => s.drinks.size >= RECIPES.length],
  ["milk","milk","Milk Master","Make 5 milk drinks", s => s.milkCups >= 5],
  ["perfect","star","Perfect Cup","Rate a drink 5 stars", () => S.log.some(x => x.rating === 5)],
  ["crowd","crowd","Crowd Pleaser","Make a round for 6 or more", () => S.log.some(x => x.n >= 6)],
  ["streak","flame","On a Roll","Make coffee 3 days in a row", s => s.streak >= 3],
  ["safety","shield","Safety First","Finish every Safety lesson", () => CATS.find(c => c.id === "safety").lessons.every(l => S.learned[l.id])],
  ["scholar","learn","Scholar","Ace every quiz", () => CATS.every(c => S.quiz[c.id] === c.quiz.length)]
];
const earned = s => BADGES.filter(b => b[4](s)).map(b => b[0]);
// Wraps any action that can earn XP and announces the gain and any new badges.
function reward(fn){
  const a = stats(), ba = earned(a);
  fn();
  const b = stats(), bb = earned(b).filter(x => !ba.includes(x));
  const msgs = [];
  if (b.xp > a.xp) msgs.push([ "spark", `+${b.xp - a.xp} XP` + (b.li > a.li ? ` · You're now a ${b.level}!` : "") ]);
  bb.forEach(id => { const B = BADGES.find(x => x[0] === id); msgs.push([B[1], `Badge: ${B[2]}`]); });
  msgs.forEach((m, i) => setTimeout(() => toast(m[0], m[1]), i * 2200));
}
let toastT;
function toast(icon, text){
  const el = $("#toast"); el.innerHTML = ic(icon) + text; el.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 2000);
  try{ navigator.vibrate && navigator.vibrate(20); }catch(e){}
}

const ISSUES = {
  bitter:["Too bitter", r => !r.instant],
  sour:["Sour or thin", r => !r.instant],
  weak:["Too weak", () => true],
  burnt:["Burnt taste", r => !r.instant],
  foam:["Foam was poor", r => r.froth !== "none" || r.instant],
  sweet:["Too sweet", () => true],
  plain:["Not sweet enough", () => true]
};
function advice(issue, r){
  const ro = S.roast;
  switch (issue){
    case "bitter": return { t:"Take it off the heat earlier.", d:`Bitterness comes from the last part of the brew. Remove the pot the moment it starts gurgling, and cool the base straight away. Also try shorter grinder pulses for a slightly coarser grind.${ro === "dark" || ro === "mdark" ? " With a darker roast, \"Mild\" strength helps too." : ""}`, fix: S.strength === "kora" ? ["strength","normal","Switch to Normal strength"] : null };
    case "sour": return { t:"Grind a little finer and use hotter water.", d:`Sour, thin coffee hasn't extracted enough. Pulse the grinder a few seconds longer and make sure the water is properly hot.${ro === "light" ? " Light roasts need a full boil." : ""}` };
    case "weak": return r.instant
      ? { t:"Use more instant coffee.", d:"Add an extra spoon of instant coffee to the cream, and whip it until it's really thick." }
      : { t:"Make it stronger.", d:"Fill the basket right to the top (level, not pressed). If it's still weak, choose Strong.", fix: S.strength !== "kora" ? ["strength", S.strength === "halka" ? "normal" : "kora", `Switch to ${S.strength === "halka" ? "Normal" : "Strong"} strength`] : null };
    case "burnt": return { t:"Lower the heat.", d:"A burnt taste means the pot sat on high heat too long. Start with hot water from the kettle, use low to medium-low heat, and leave the lid open so you can catch it early." };
    case "foam": return r.instant
      ? { t:"Whip longer.", d:"Keep whipping on FAST until it holds its shape on an upside-down spoon. Equal parts coffee, sugar and hot water matter." }
      : { t:"Better foam: right milk, right heat.", d:"Use full-cream milk, heat it to about 65°C (not boiling), and don't fill the pitcher past the mark. Hold the frother near the surface at first to pull in air." };
    case "sweet": return { t:"Use less sugar next time.", d:"You can always add sugar at the table.", fix: SWEET[S.sweet] > 0 ? ["sweet", Object.keys(SWEET)[SWEET[S.sweet] - 1], "Use less sugar next time"] : null };
    case "plain": return { t:"Add a little more sugar.", d:"Stir it in while the coffee is hot, so it dissolves.", fix: SWEET[S.sweet] < 3 ? ["sweet", Object.keys(SWEET)[SWEET[S.sweet] + 1], "Use more sugar next time"] : null };
  }
}

function go(view){

function nav(d){

  S.step = Math.min(Math.max(0, S.step + d), steps.length - 1);

/* ---------- Keep the screen awake while cooking ---------- */
let wake = null;
async function wakeOn(){ try{ if (!wake && "wakeLock" in navigator){ wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; }); } }catch(e){} }
function wakeOff(){ try{ wake && wake.release(); }catch(e){} wake = null; }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.view === "cook" && tabVisible("make")) wakeOn(); });

/* ---------- Swipe between steps ---------- */
let tx = null, ty = null;
document.addEventListener("touchstart", e => { if (S.view !== "cook" || !tabVisible("make")) return; tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
document.addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) nav(dx < 0 ? 1 : -1);
}, {passive:true});
document.addEventListener("keydown", e => { if (S.view !== "cook" || !tabVisible("make")) return; if (e.key === "ArrowRight") nav(1); if (e.key === "ArrowLeft") nav(-1); });

/* ---------- Timer: lives on its step, floats as a pill when you move away ---------- */
let tInt = null, tLeft = 0, tStep = -1, tDone = false;
const fmt = s => `${Math.floor(s/60)}:${String(Math.max(0,s)%60).padStart(2,"0")}`;
function startTimer(sec){
  clearInterval(tInt); tLeft = sec; tStep = S.view === "cook" ? S.step : -1; tDone = false;
  tInt = setInterval(() => {
    tLeft--;
    if (tLeft <= 0){ clearInterval(tInt); tInt = null; tDone = true; beep(); try{ navigator.vibrate && navigator.vibrate([300,150,300]); }catch(e){} }
    paintTimer();
  }, 1000);
  paintTimer();
}
function stopTimer(){ clearInterval(tInt); tInt = null; tStep = -1; tDone = false; paintTimer(); if (S.view === "cook" && tabVisible("make")) renderCook(); }
function paintTimer(){
  const box = $("#tbox");
  if (box && S.view === "cook" && tStep === S.step){
    box.className = "tbox " + (tDone ? "ding" : "run");
    $("#tbv").textContent = tDone ? "Done" : fmt(tLeft);
    box.querySelector("button").innerHTML = tDone ? ic("play")+"Start timer" : ic("stop")+"Stop";
  }
  updateFloat();
}
function updateFloat(){
  const el = $("#timer"), onItsStep = S.view === "cook" && tStep === S.step && tabVisible("make");
  el.classList.toggle("show", (tInt !== null || tDone) && !onItsStep);
  el.classList.toggle("ding", tDone);
  $("#tval").textContent = tDone ? "Time's up! Check it" : fmt(tLeft);
}
function beep(){
  try{ const a = new (window.AudioContext||window.webkitAudioContext)(); [0,0.35,0.7].forEach(t => { const o=a.createOscillator(), g=a.createGain(); o.frequency.value=880; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.2,a.currentTime+t); o.start(a.currentTime+t); o.stop(a.currentTime+t+.2); }); }catch(e){}
}
$("#tstop").onclick = stopTimer;

/* ---------- Events ---------- */
$("#tabs").innerHTML = [["make","cup","Make"],["inv","jar","Pantry"],["tips","learn","Learn"]].map(([k,i,l]) => `<button data-tab="${k}" class="${k==="make"?"on":""}">${ic(i)}${l}</button>`).join("");

function showTab(tab){
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  ["make","inv","tips"].forEach(x => $("#tab-"+x).classList.toggle("hide", x !== tab));
  document.body.classList.remove("cooking","has-cta","sub");

document.addEventListener("click", e => {

  if (D.tab){
    if (D.tab === "make" && tabVisible("make") && S.view === "setup") go("pick");

  if (D.go){ go(D.go); return; }
  if ("start" in D){ S.step = 0; go("cook"); return; }
  if ("again" in D){ S.step = 0; go("setup"); return; }
  if (D.nav){ nav(+D.nav); return; }
  if (D.lang){ S.lang = D.lang; save(); renderMake(); return; }
  if (D.ppl){ S.people = Math.min(20, Math.max(1, S.people + +D.ppl)); save(); renderMake(); return; }
  const sg = t.closest("[data-seg]");
  if (sg && D.v){ S[sg.dataset.seg] = D.v; save(); renderMake(); return; }
  if (D.timer){ if (tStep === S.step && tInt !== null) stopTimer(); else startTimer(+D.timer); return; }
  // Rating
  if (D.star){ rateDraft.rating = +D.star; if (rateDraft.rating === 5) rateDraft.issues.clear(); renderDone(); return; }
  if (D.issue){ rateDraft.issues.has(D.issue) ? rateDraft.issues.delete(D.issue) : rateDraft.issues.add(D.issue); renderDone(); return; }
  if ("rate" in D){ reward(() => { const x = S.log[S.log.length - 1]; if (x){ x.rating = rateDraft.rating; x.issues = [...rateDraft.issues]; } save(); }); rateDraft.saved = true; renderDone(); return; }
  if (D.fix){ const [k, v] = D.fix.split(":"); S[k] = v; save(); t.outerHTML = `<span class="small" style="color:var(--ok);font-weight:700">${ic("check")} Saved for next time</span>`; return; }
  // Learn
  if (D.cat !== undefined){ learnCat = D.cat || null; openLesson = null; quiz = null; renderLearn(); window.scrollTo(0,0); return; }
  if (D.lesson){ openLesson = openLesson === D.lesson ? null : D.lesson; renderCat(); return; }
  if (D.got){ reward(() => { S.learned[D.got] = true; save(); }); renderCat(); return; }
  if (D.quiz === "start"){ quiz = { i:0, score:0, picked:null }; renderCat(); window.scrollTo(0,0); return; }
  if (D.quiz === "close"){ quiz = null; renderCat(); return; }
  if (D.ans !== undefined && quiz){ const c = CATS.find(x => x.id === learnCat); quiz.picked = +D.ans; if (quiz.picked === c.quiz[quiz.i].a) quiz.score++; try{ navigator.vibrate && navigator.vibrate(quiz.picked === c.quiz[quiz.i].a ? 15 : [30,40,30]); }catch(e){} renderCat(); return; }
  if (D.quiz === "next"){ const c = CATS.find(x => x.id === learnCat); quiz.i++; quiz.picked = null;
    if (quiz.i >= c.quiz.length){ const sc = quiz.score; reward(() => { S.quiz[c.id] = Math.max(S.quiz[c.id] || 0, sc); save(); }); }
    renderCat(); return; }
  if (t.id === "reset" && confirm("This resets your pantry and pot settings to the defaults. Your progress is kept. Continue?")){
    const keep = { log:S.log, learned:S.learned, quiz:S.quiz, lang:S.lang }; S = { ...structuredClone(DEFAULTS), ...keep }; save(); renderAll(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.inv){ S.inv[t.dataset.inv] = t.checked; save(); renderMake(); }
  if (t.id === "grinder"){ S.grinder = t.value; save(); renderMake(); }
  if (t.dataset.set){ const v = +t.value; if (v > 0){ S[t.dataset.set] = v; save(); renderMake(); } }
});

// A saved "done" screen is stale on reopen; resume cooking mid-recipe, otherwise start fresh.
if (S.view === "done") S.view = "pick";
renderAll();
</script>
