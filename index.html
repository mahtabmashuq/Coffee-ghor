<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coffee Ghor</title>
<meta name="description" content="Our home coffee guide: pick a drink and how many people, get exact amounts and step-by-step instructions.">
<meta name="theme-color" content="#f7f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a120d" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coffee Ghor">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --bg:oklch(96.5% .012 70); --card:oklch(98.8% .006 75); --ink:oklch(24% .03 45); --muted:oklch(48% .03 50); --line:oklch(89% .02 65);
  --brand:oklch(40% .08 45); --brand-ink:oklch(98.5% .005 75); --soft:oklch(93% .022 70);
  --ok:oklch(48% .1 150); --warn:oklch(55% .13 60); --bad:oklch(50% .16 25);
  --c-coffee:oklch(33% .06 45); --c-water:oklch(46% .07 55); --c-milk:oklch(91% .035 80); --c-foam:oklch(98% .01 85); --c-whip:oklch(68% .1 65);
  --radius:14px; --ease:cubic-bezier(.22,1,.36,1);
  --f-display:"Young Serif",Georgia,serif; --f-body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --nav-h:calc(68px + env(safe-area-inset-bottom));
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:oklch(18% .015 50); --card:oklch(22% .018 50); --ink:oklch(93% .015 70); --muted:oklch(72% .025 60); --line:oklch(31% .02 50);
    --brand:oklch(74% .09 60); --brand-ink:oklch(18% .015 50); --soft:oklch(27% .022 50);
    --ok:oklch(72% .12 150); --warn:oklch(76% .12 65); --bad:oklch(70% .14 25);
    --c-milk:oklch(86% .03 80); --c-foam:oklch(95% .01 85);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.55 var(--f-body);padding-bottom:calc(var(--nav-h) + 24px);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.has-cta{padding-bottom:calc(var(--nav-h) + 110px)}
body.cooking{padding-bottom:calc(var(--nav-h) + 40px)}
body.cooking header,body.cooking nav.tabs,body.has-cta header{display:none}
header{padding:28px 16px 4px;max-width:720px;margin:0 auto}
header h1{margin:0;font:400 32px/1.1 var(--f-display);letter-spacing:-.01em}
header p{margin:6px 0 0;color:var(--muted);font-size:17px;max-width:36ch}
main{max-width:720px;margin:0 auto;padding:0 16px}
button{font:inherit;color:inherit;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* Bottom nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav.tabs button{flex:1;max-width:180px;background:none;border:0;color:var(--muted);font-weight:700;font-size:16px;border-radius:10px;cursor:pointer;transition:background .2s var(--ease),color .2s var(--ease)}
nav.tabs button.on{color:var(--brand-ink);background:var(--brand)}

h2{font:400 24px/1.2 var(--f-display);margin:32px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:10px 0}

/* Pick */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:10px}
.drink{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:12px 12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:border-color .2s var(--ease),transform .15s var(--ease)}
.drink:active{transform:scale(.97)}
.drink svg{width:40px;height:44px;margin-bottom:6px}
.drink b{font-size:17px;line-height:1.25}
.drink small{color:var(--muted);font-size:15px;line-height:1.4}
.drink .state{margin-top:auto;padding-top:8px;font-size:14px;font-weight:700}
.st-ok{color:var(--ok)} .st-no{color:var(--bad)}

/* Setup */
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--brand);font-weight:700;font-size:16px;padding:10px 0;margin-top:12px;cursor:pointer}
.hero{display:flex;gap:16px;align-items:center;margin:8px 0 6px}
.hero svg{width:64px;height:70px;flex:0 0 64px}
.hero h2{margin:0}
.hero p{margin:4px 0 0;color:var(--muted);font-size:16px}
.field+.field{margin-top:20px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:52px;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:26px;cursor:pointer}
.stepper output{font:400 32px var(--f-display);min-width:48px;text-align:center}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;font-size:16px;padding:11px 10px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:background .2s var(--ease)}
.seg button.on{background:var(--brand);color:var(--brand-ink);font-weight:700}
label.lbl{display:block;font-size:15px;color:var(--muted);margin-bottom:8px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px 12px}
.stat .v{font:400 25px/1.15 var(--f-display)}
.stat .k{font-size:15px;color:var(--muted)}
.note{border-radius:12px;padding:12px 14px;font-size:16px;margin:10px 0}
.n-warn{background:color-mix(in oklch,var(--warn) 14%,var(--bg))}
.n-bad{background:color-mix(in oklch,var(--bad) 13%,var(--bg))}
.n-tip{background:var(--soft)}
.note b{display:block;margin-bottom:2px}
.cta{position:fixed;left:0;right:0;bottom:var(--nav-h);padding:12px 16px;background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:9}
.cta button{display:block;width:100%;max-width:688px;margin:0 auto;border:0;border-radius:14px;padding:17px 18px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:19px;cursor:pointer;transition:transform .15s var(--ease)}
.cta button:active{transform:scale(.98)}
.cta button small{display:block;font-weight:400;font-size:14px;opacity:.85}
.cta button:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}

/* Cook */
.cook-top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.x{background:none;border:0;color:var(--muted);font-weight:700;font-size:16px;padding:10px 4px;cursor:pointer}
.lang{display:flex;background:var(--soft);border-radius:99px;padding:3px}
.lang button{border:0;background:none;font-weight:700;font-size:14px;letter-spacing:.04em;padding:7px 14px;border-radius:99px;cursor:pointer;color:var(--muted)}
.lang button.on{background:var(--brand);color:var(--brand-ink)}
.prog{display:flex;gap:4px;margin:4px 0 22px}
.prog i{flex:1;height:6px;border-radius:99px;background:var(--line);transition:background .3s var(--ease)}
.prog i.d{background:var(--brand)}
.prog i.c{background:color-mix(in oklch,var(--brand) 45%,var(--line))}
.count{font-size:15px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.drinkname{font-size:15px;color:var(--muted);margin-bottom:6px}
.stepcard{animation:in .35s var(--ease)}
.stepcard.back-anim{animation:inb .35s var(--ease)}
@keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes inb{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.stepcard,.stepcard.back-anim{animation:none}}
.stepcard h3{font:400 30px/1.2 var(--f-display);margin:6px 0 14px;text-wrap:balance}
.stepcard p{font-size:20px;line-height:1.6;margin:0;max-width:60ch}
.stepcard p strong{font-weight:700}
.tbox{margin-top:24px;display:flex;align-items:center;gap:16px;background:var(--soft);border-radius:var(--radius);padding:14px 16px}
.tbox .tv{font:400 34px var(--f-display);font-variant-numeric:tabular-nums;min-width:90px}
.tbox button{border:0;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:16px;border-radius:99px;padding:12px 20px;cursor:pointer}
.tbox.run button{background:none;border:1.5px solid var(--ink);color:var(--ink)}
.tbox.ding{background:color-mix(in oklch,var(--ok) 20%,var(--bg))}
.cook-nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;z-index:10}
.cook-nav button{flex:1;max-width:340px;border-radius:14px;padding:17px;font-weight:700;font-size:19px;cursor:pointer;border:1.5px solid var(--line);background:var(--card);transition:transform .15s var(--ease)}
.cook-nav button:active{transform:scale(.97)}
.cook-nav .next{flex:2;background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.cook-nav button:disabled{opacity:.35}
.swipe-hint{font-size:14px;color:var(--muted);text-align:center;margin-top:28px}
.done{text-align:center;padding-top:40px}
.done svg{width:96px;height:104px}
.done h3{font:400 32px/1.2 var(--f-display);margin:16px 0 8px}
.done p{color:var(--muted);margin:0 0 28px}
.done .btn{max-width:340px;margin:10px auto 0;display:block}

/* Pantry */
.btn{border:0;background:var(--soft);border-radius:12px;padding:15px 16px;font-weight:700;font-size:17px;cursor:pointer;width:100%;margin-top:16px}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}
.toggle:last-child{border-bottom:0}
.toggle small{display:block;color:var(--muted);font-size:15px}
.tag{font-size:15px;font-weight:700;color:var(--ok);white-space:nowrap}
.sw{position:relative;width:52px;height:32px;flex:0 0 52px}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:background .2s var(--ease);cursor:pointer}
.sw i:before{content:"";position:absolute;width:26px;height:26px;left:3px;top:3px;background:var(--card);border-radius:50%;transition:transform .2s var(--ease)}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i:before{transform:translateX(20px)}
.sw input:focus-visible+i{outline:2px solid var(--brand);outline-offset:2px}
input[type=number],select{font:inherit;font-size:17px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:120px}

/* Floating timer (shows when you leave the timer's step) */
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px);background:var(--ink);color:var(--bg);border-radius:99px;padding:10px 12px 10px 20px;display:none;align-items:center;gap:14px;font-weight:700;font-size:19px;box-shadow:0 8px 28px oklch(0% 0 0 / .25);z-index:20;font-variant-numeric:tabular-nums}
.timer.show{display:flex}
.timer.ding{background:var(--ok);color:var(--brand-ink)}
.timer button{background:none;border:1.5px solid currentColor;border-radius:99px;padding:4px 12px;font-weight:700;font-size:14px;cursor:pointer}
body.has-cta .timer{bottom:calc(var(--nav-h) + 96px)}

.tips p,.tips li{font-size:17px}
.tips ul{padding-left:20px;margin:4px 0}
.tips li+li{margin-top:6px}
.muted{color:var(--muted)}
.small{font-size:15px}
.hide{display:none}
footer{text-align:center;margin:32px 0;color:var(--muted);font-size:15px}
</style>
</head>
<body>
<header>
  <h1>Coffee Ghor</h1>
  <p>Pick a drink, tell us how many people, then follow along one step at a time.</p>
</header>

<main>
  <section id="tab-make"></section>
  <section id="tab-inv" class="hide"></section>
  <section id="tab-tips" class="hide"></section>
</main>

<div class="timer" id="timer" role="status"><span id="tval">0:00</span><button id="tstop">Stop</button></div>

<nav class="tabs">
  <button data-tab="make" class="on">Make</button>
  <button data-tab="inv">Pantry</button>
  <button data-tab="tips">Tips</button>
</nav>

<script>
/* ---------- State ---------- */
// Keys (halka/kora, kom/beshi) are kept from v1 so saved settings on phones still load.
const DEFAULTS = {
  drink: "cappuccino", people: 2, strength: "normal", sweet: "normal", source: "auto", roast: "medium",
  grinder: "ok",                  // ok | check | broken
  mokaWater: 300,                 // ml, 6-cup pot, just below the valve
  mokaCoffee: 28,                 // g per brew, 6-cup basket filled level
  yieldPct: 88,                   // % of water that comes out as coffee
  pitcher: 350,
  inv: { beans:true, ground:false, instant:false, milk:true, sugar:true, cocoa:false, ice:false, condensed:false },
  view: "pick",                   // pick | setup | cook | done
  step: 0,
  lang: "en"                      // steps language: en | bn
};
const KEY = "coffee-ghor-v1";
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s) return {...DEFAULTS, ...s, inv:{...DEFAULTS.inv, ...(s.inv||{})}}; }catch(e){} return structuredClone(DEFAULTS); }
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- Recipes (per person) ---------- */
// coffee: moka coffee ml, water: hot water ml, milk: ml, milkMode: hot|cold|boil, froth: thick|light|none
const RECIPES = [
  { id:"moka", name:"Espresso", desc:"Strong and black, in a small cup. Made in the moka pot.", coffee:50, water:0, milk:0, froth:"none" },
  { id:"americano", name:"Americano", desc:"Espresso topped up with hot water. Lighter black coffee.", coffee:60, water:120, milk:0, froth:"none" },
  { id:"cappuccino", name:"Cappuccino", desc:"Espresso, hot milk and a thick layer of foam.", coffee:60, water:0, milk:100, milkMode:"hot", froth:"thick" },
  { id:"latte", name:"Latte", desc:"Lots of milk, a thin layer of foam. Mild and creamy.", coffee:60, water:0, milk:180, milkMode:"hot", froth:"light" },
  { id:"flatwhite", name:"Flat White", desc:"More coffee, less milk, smooth silky foam.", coffee:70, water:0, milk:110, milkMode:"hot", froth:"light" },
  { id:"mocha", name:"Mocha", desc:"A latte with chocolate. For a sweet tooth.", coffee:60, water:0, milk:150, milkMode:"hot", froth:"light", cocoa:1 },
  { id:"doodh", name:"Café au Lait", desc:"Coffee stirred into boiled, sweetened milk. Home style.", coffee:45, water:0, milk:160, milkMode:"boil", froth:"light", condensedOpt:true },
  { id:"icedlatte", name:"Iced Latte", desc:"Espresso, cold milk and ice. For hot days.", coffee:60, water:0, milk:150, milkMode:"cold", froth:"none", ice:5 },
  { id:"icedmocha", name:"Iced Mocha", desc:"An iced latte with chocolate.", coffee:60, water:0, milk:150, milkMode:"cold", froth:"none", ice:5, cocoa:1 },
  { id:"dalgona", name:"Whipped Coffee", desc:"Whipped instant coffee on cold milk. No moka pot needed.", coffee:0, instant:1, water:0, milk:200, milkMode:"cold", froth:"none", ice:4 }
];
const STRENGTH = { halka:0.75, normal:1, kora:1.3 };
const STRENGTH_LBL = { halka:"Mild", normal:"Normal", kora:"Strong" };
const SWEET = { none:0, kom:1, normal:2, beshi:3 };
const SWEET_LBL = { none:"No sugar", kom:"Less", normal:"Normal", beshi:"More" };
// Per roast: grind time, water temp, heat, when to take off. Each text has en + bn (Banglish, steps only).
// Dose stays the same: the basket is always filled level.
const ROASTS = {
  light:  { lbl:"Light",
            pulse:["about 15-18 seconds in total. Light beans are hard, so grind a little finer.", "mot 15-18 sec. Light beans shokto, tai ektu beshi mihi korte hobe."],
            water:["Bring it to a full boil. Light roasts need more heat to bring out the flavour.", "Puro fute uthle namao. Light roast e beshi gorom lage flavor ber korte."],
            heat:["medium","medium"],
            pull:["Let light roasts run a little longer, but take it off as soon as it starts gurgling.", "Light roast e dhara ektu beshi cholte dao, kintu gurgle shuru holei namao."],
            black:"Light roast is best black: fruity, slightly sour.", milk:"Light roast gets lost in milk. Pick \"Strong\", or try Espresso or Americano." },
  medium: { lbl:"Medium", pulse:["about 12-15 seconds in total.","mot 12-15 sec."], water:["Heat until just before it boils.","Fute uthar thik age porjonto."], heat:["medium-low","medium-low"], pull:["",""],
            black:"Medium roast: balanced, good black.", milk:"Medium roast: balanced, good with milk." },
  mdark:  { lbl:"Medium-Dark", pulse:["about 10-12 seconds in total.","mot 10-12 sec."], water:["Heat until just before it boils.","Fute uthar thik age porjonto."], heat:["medium-low","medium-low"],
            pull:["Take it off as soon as the stream starts turning pale.","Dhara halka rong hote shuru korlei namao."],
            black:"Medium-dark can taste a bit bitter black. Try \"Mild\" strength.", milk:"Medium-dark with milk is a perfect match. Chocolatey." },
  dark:   { lbl:"Dark",
            pulse:["about 8-10 seconds in total. Dark beans are soft and grind fast. Too long turns them to powder and makes it bitter.", "mot 8-10 sec. Dark beans naram, taratari guro hoy. Beshi chalale powder hoye tita hobe."],
            water:["Boil, then let it cool for 1 minute before pouring.","Fute uthle 1 min thanda hote dao, tarpor dhalo."], heat:["low","kom"],
            pull:["Take dark roasts off EARLY, as soon as the stream turns pale. Dark roasts go bitter fast.","Dark roast e AGE namao: dhara halka hote shuru korlei. Dark taratari tita hoy."],
            black:"Dark roast is very bitter black. Add more water to the Americano, or pick \"Mild\".", milk:"Dark roast is best with milk and chocolate. The milk hides the bitterness." },
  unknown:{ lbl:"Not sure", pulse:["about 12-15 seconds in total.","mot 12-15 sec."], water:["Heat until just before it boils.","Fute uthar thik age porjonto."], heat:["medium-low","medium-low"], pull:["",""],
            black:"Roast unknown, so the app assumes medium. See \"How to tell the roast\" in Tips.", milk:"Roast unknown, so the app assumes medium. See \"How to tell the roast\" in Tips." }
};
const BLACK = ["moka","americano"];
const roast = () => ROASTS[S.roast] || ROASTS.medium;
const INV_LBL = {
  beans:["Whole coffee beans","Need the grinder"],
  ground:["Ground coffee","Works even if the grinder is broken"],
  instant:["Instant coffee","For Whipped Coffee"],
  milk:["Milk","Full-cream milk makes the best foam"],
  sugar:["Sugar",""],
  cocoa:["Cocoa powder or chocolate","For Mocha"],
  ice:["Ice","For iced drinks"],
  condensed:["Condensed milk","Optional, for Café au Lait"]
};
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

/* ---------- Cup illustration: layers drawn to the recipe's real proportions ---------- */
function cup(r, tag=""){
  const W = 40, H = 44, top = 4, bot = 40, inner = bot - top;
  const L = [];
  if (r.instant){ L.push(["--c-milk", r.milk], ["--c-whip", 60]); }
  else {
    if (r.coffee) L.push([r.water ? "--c-water" : "--c-coffee", r.coffee + r.water]);
    if (r.milk){
      const foam = r.froth === "thick" ? .4 : r.froth === "light" ? .15 : 0;
      L.push(["--c-milk", r.milk * (1 - foam)]);
      if (foam) L.push(["--c-foam", r.milk * foam]);
    }
  }
  const total = L.reduce((a, [, v]) => a + v, 0), fill = Math.min(1, total / 260);
  let y = bot, rects = "";
  for (const [c, v] of L){
    const h = inner * fill * v / total; y -= h;
    rects += `<rect x="0" y="${y.toFixed(1)}" width="${W}" height="${h.toFixed(1)}" fill="var(${c})"/>`;
  }
  if (r.ice) rects += [[8, bot - 12], [20, bot - 20], [13, bot - 27]].map(([x, yy]) => `<rect x="${x}" y="${yy}" width="9" height="9" rx="2" fill="none" stroke="var(--card)" stroke-width="1.5" opacity=".8"/>`).join("");
  const path = `M6 ${top} L34 ${top} L31 ${bot} Q30.5 ${bot + 2} 28 ${bot + 2} L12 ${bot + 2} Q9.5 ${bot + 2} 9 ${bot} Z`;
  const id = `c-${r.id}${tag}`;
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><defs><clipPath id="${id}"><path d="${path}"/></clipPath></defs>
    <g clip-path="url(#${id})">${rects}</g><path d="${path}" fill="none" stroke="var(--muted)" stroke-width="1.5"/></svg>`;
}

/* ---------- Logic ---------- */
const grinderOk = () => S.grinder === "ok";
function coffeeSource(){
  const beansOk = S.inv.beans && grinderOk();
  if (S.source === "beans" && beansOk) return "beans";
  if (S.source === "ground" && S.inv.ground) return "ground";
  if (beansOk) return "beans";
  if (S.inv.ground) return "ground";
  return null;
}
function missing(r){
  const m = [];
  if (r.coffee > 0 && !coffeeSource()){
    if (S.inv.beans && !grinderOk()) m.push("a working grinder (or ground coffee)");
    else m.push("coffee (beans or ground)");
  }
  if (r.instant && !S.inv.instant) m.push("instant coffee");
  if (r.instant && !S.inv.sugar) m.push("sugar (needed for whipping)");
  if (r.milk > 0 && !S.inv.milk) m.push("milk");
  if (r.cocoa && !S.inv.cocoa) m.push("cocoa or chocolate");
  if (r.ice && !S.inv.ice) m.push("ice");
  return m;
}
function plan(r){
  const n = S.people, f = STRENGTH[S.strength];
  const p = { n };
  p.coffeePer = Math.round(r.coffee * f);
  // Mild americano: less coffee, more water, same cup size
  p.waterPer = r.water ? Math.round(r.water + r.coffee - p.coffeePer) : 0;
  p.coffeeTotal = p.coffeePer * n;
  p.yieldPerBrew = Math.round(S.mokaWater * S.yieldPct / 100);
  p.brews = p.coffeeTotal > 0 ? Math.ceil(p.coffeeTotal / p.yieldPerBrew) : 0;
  p.grams = p.brews * S.mokaCoffee;
  p.tbsp = Math.round(p.grams / 5.5);
  p.milkPer = r.milk; p.milkTotal = r.milk * n;
  const cap = r.froth === "thick" ? Math.round(S.pitcher * 0.43) : Math.round(S.pitcher * 0.57); // 350 pitcher: 150 / 200 mark
  p.frothCap = cap;
  p.frothBatches = r.froth !== "none" && p.milkTotal ? Math.ceil(p.milkTotal / cap) : 0;
  p.sugarTsp = r.instant ? 0 : SWEET[S.sweet] * n;
  p.cocoaTbsp = (r.cocoa || 0) * n;
  p.ice = (r.ice || 0) * n;
  p.instantTbsp = r.instant ? Math.max(2, r.instant * n) : 0;
  p.hotWaterTotal = p.waterPer * n;
  // Time: ~8 min per brew + 3 min cool/refill between brews, + 4 min prep
  p.minutes = r.instant ? 6 + Math.ceil(n/2) : p.brews * 8 + Math.max(0, p.brews - 1) * 3 + 4 + (p.frothBatches > 1 ? p.frothBatches - 1 : 0);
  return p;
}

// Steps in the chosen language. Numbers and amounts are shared; only the words change.
function buildSteps(r, p, lang){

    s.push({ t:L("Spoon the cream on top","Upore cream dao"),
      d:L("Spoon the whipped coffee over the milk. Stir it in before drinking.","Chamuch diye dalgona cream dudher upor rakho. Serve korar shomoy mix kore khabe.") });

  } else {

  const hotWater = p.brews * S.mokaWater + p.hotWaterTotal;
  s.push({ t:L(`Heat ${hotWater} ml water in the kettle`,`Kettle e ${hotWater} ml pani gorom koro`),
    d:L(`${R("water")} Starting with hot water means the pot spends less time on the stove, so the coffee doesn't burn or turn bitter.`,
        `${R("water")} Moka te gorom pani dile coffee pora/tita hoy na, karon pot chula te kom shomoy thake.`) });
  if ((r.milkMode === "hot" || r.milkMode === "boil") && p.milkTotal){
    s.push({ t:L(`Heat all the milk: ${p.milkTotal} ml`,`Ekshathe dudh gorom koro: ${p.milkTotal} ml`), d: r.milkMode === "boil"
      ? L("Bring the milk to a boil once, then turn the heat down. You can add the sugar to the milk now.","Deshi style: dudh ekbar fotiye nao, tarpor anch komao. Chini ekhoni dudhe dite paro.")
      : L("Steaming, with small bubbles at the edge, but **NOT boiling** (about 65°C). Too hot and it won't foam, and it loses its sweetness.",
          "Dhoa uthbe, kinar e choto bubble, kintu **futbe NA** (~65°C). Beshi gorom hole foam hoy na ar dudher mishti bhab chole jay.") });
  }
  const multi = p.brews > 1 ? ` (${L("brew","brew")} 1/${p.brews})` : "";
  s.push({ t:L(`Pour hot water into the moka base${multi}`,`Moka bottom e gorom pani dhalo${multi}`),
    d:L(`Fill to **just below the safety valve** (about ${S.mokaWater} ml). Never cover the valve. The base is hot: hold it with a cloth.`,

  s.push({ t:L(`Put ${S.mokaCoffee} g coffee in the basket`,`Basket e ${S.mokaCoffee} g coffee dao`),

  s.push({ t:L(`Screw it together, put it on ${R("heat")} heat`,`Pot jora lagao, ${R("heat")} anche bosao`),
    d:L("Hold the base with a cloth and screw it on tight. Leave the lid open so you can watch.",
        "Kapor diye dhore shokto kore pyach dao. Dhakna khola rakho jate dekhte paro.") });
  s.push({ t:L("Watch the coffee come out","Coffee ber hote dekho"), timer:300,
    d:L(`It should flow slowly, like honey. As soon as it turns pale yellow or starts gurgling, **take it off the heat right away**. The last bit is bitter. ${R("pull")}`,

      : { t:L(`Froth the milk${bt}`,`Dudh froth koro${bt}`), timer:15,
          d:L("Milk in the pitcher, **between the 150 and 250 marks**. Frother on **MEDIUM**, fully under the surface, 10-15 seconds. You want silky, tiny bubbles, not stiff foam. Swirl the pitcher to mix.",
              "Pitcher e **150 ar 250 dag er majhamajhi** porjonto dudh. Frother **MEDIUM** speed, puro niche dubiye 10-15 sec. Amra silky, choto bubble er foam chai, ghono na. Pitcher ghuriye mix koro.") });
  }
  const sw = SWEET[S.sweet];
  const sugarLine = sw ? L(` Stir **${plural(sw, "teaspoon", "teaspoons")} of sugar** into each cup while the coffee is hot.`,` Proti cup e **${sw} chamuch chini**, coffee gorom thaktei gholao.`) : "";
  switch (r.id){
    case "moka": s.push({ t:L(`Serve ${p.coffeePer} ml per cup`,`Proti cup e ${p.coffeePer} ml serve koro`), d:L(`Pour into small cups.${sugarLine}`,`Choto cup e dhalo.${sugarLine}`) }); break;
    case "americano": s.push({ t:L("Serve","Serve koro"),
      d:L(`Pour **${p.waterPer} ml hot water** into each cup first, then **${p.coffeePer} ml coffee**.${sugarLine}`,`Cup e age **${p.waterPer} ml gorom pani**, tarpor **${p.coffeePer} ml coffee**.${sugarLine}`) }); break;
    case "cappuccino": s.push({ t:L("Put it together","Assemble koro"),
      d:L(`**${p.coffeePer} ml coffee** in each cup.${sugarLine} Hold back the foam with a spoon and pour the milk, then spoon the foam on top. Dust with cocoa if you like.`,
          `Cup e **${p.coffeePer} ml coffee**.${sugarLine} Chamuch diye foam atkiye dudh dhalo, sheshe foam upore tule dao. Upore cocoa chhitate paro.`) }); break;
    case "latte":
    case "flatwhite": s.push({ t:L("Put it together","Assemble koro"),
      d:L(`**${p.coffeePer} ml coffee** in each cup.${sugarLine} Then pour **${p.milkPer} ml frothed milk** slowly into the middle.`,

    case "mocha": s.push({ t:L("Chocolate paste, then put it together","Chocolate paste + assemble"),
      d:L(`In each cup, mix **${r.cocoa} tbsp cocoa**, the sugar and 2 spoons of hot coffee into a smooth paste (no lumps). Then add the rest of the coffee, then **${p.milkPer} ml milk**.`,

    case "doodh": s.push({ t:L("Mix and serve","Mix kore serve koro"),

          `Gorom dudhe coffee dhalo: proti cup e **${p.coffeePer} ml coffee**, **${p.milkPer} ml dudh**.${sugarLine}${S.inv.condensed ? " Condensed milk 1 chamuch dile aro creamy hobe." : ""} Upore halka foam.`) }); break;

  }
  return s;
}
const md = t => t.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");

/* ---------- Render: Make (pick → setup → cook → done) ---------- */
const $ = (sel, el=document) => el.querySelector(sel);

function go(view){ S.view = view; if (view !== "cook") S.step = view === "done" ? S.step : 0; save(); renderMake(); window.scrollTo(0,0); }
function nav(d){
  const steps = buildSteps(recipe(), plan(recipe()), S.lang);
  if (d > 0 && S.step >= steps.length - 1){ go("done"); return; }
  S.step = Math.min(Math.max(0, S.step + d), steps.length - 1);
  animDir = d < 0 ? "back-anim" : ""; save(); renderMake(); window.scrollTo(0,0);
  try{ navigator.vibrate && navigator.vibrate(8); }catch(e){}
}

/* ---------- Keep the screen awake while cooking ---------- */
let wake = null;
async function wakeOn(){ try{ if (!wake && "wakeLock" in navigator){ wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; }); } }catch(e){} }
function wakeOff(){ try{ wake && wake.release(); }catch(e){} wake = null; }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.view === "cook" && !$("#tab-make").classList.contains("hide")) wakeOn(); });

/* ---------- Swipe between steps ---------- */
let tx = null, ty = null;
document.addEventListener("touchstart", e => { if (S.view !== "cook") return; tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
document.addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) nav(dx < 0 ? 1 : -1);
}, {passive:true});
document.addEventListener("keydown", e => { if (S.view !== "cook") return; if (e.key === "ArrowRight") nav(1); if (e.key === "ArrowLeft") nav(-1); });

  <h2>Moka pot settings</h2><div class="card">
    <p class="small muted" style="margin-top:0">Measure once with a measuring cup and enter the numbers here. Every amount in the app is based on these.</p>
    <div class="toggle"><div><b>Water in the base</b><small>Up to just below the valve, ml</small></div><input type="number" min="50" max="600" data-set="mokaWater" value="${S.mokaWater}"></div>
    <div class="toggle"><div><b>Coffee in the basket</b><small>Filled level, grams</small></div><input type="number" min="5" max="60" data-set="mokaCoffee" value="${S.mokaCoffee}"></div>
    <div class="toggle"><div><b>Coffee yield</b><small>% of the water that comes out as coffee, usually 80-90</small></div><input type="number" min="50" max="100" data-set="yieldPct" value="${S.yieldPct}"></div>
    <div class="toggle"><div><b>Pitcher size</b><small>ml</small></div><input type="number" min="150" max="1000" data-set="pitcher" value="${S.pitcher}"></div>
  </div>
  <button class="btn" id="reset">Reset everything to defaults</button>`;
  $("#tab-inv").innerHTML = h;
}

/* ---------- Render: Tips ---------- */
function renderTips(){
  $("#tab-tips").innerHTML = `
  <h2>5 rules for great coffee</h2>
  <div class="card tips"><ul>
    <li><b>Fresh beans, fresh grind.</b> Brew within 15 minutes of grinding. Keep beans in an airtight jar, out of the sun, not in the fridge.</li>
    <li><b>Hot water in the moka pot.</b> Cold water keeps the pot on the stove too long and burns the coffee.</li>
    <li><b>Don't press the coffee down.</b> Just fill the basket level. Pressing it raises the pressure: bitter, and a safety risk.</li>
    <li><b>Take it off early.</b> Remove it as soon as you hear gurgling or see the stream go pale. The last part is the most bitter.</li>
    <li><b>Don't boil the milk</b> for lattes and cappuccinos. Aim for 60-65°C: too hot to hold the pitcher for more than 3 seconds.</li>
  </ul></div>

  <h2>Grinder safety check</h2>
  <div class="card tips">
    <p style="margin-top:0">Salt water can cause short circuits and rust in electrical things. Don't plug it in until you've done this:</p>
    <ul>
      <li>Unplug it and wipe the blade and chamber with a tissue. If there are white salt marks, wipe with a slightly damp cloth, then a dry one.</li>
      <li>Leave it to dry for at least 48 hours somewhere airy. Longer if water got into the motor vents.</li>
      <li>Check the cord and plug pins for black or green marks (corrosion). If you see any, don't use it.</li>
      <li>Run it empty for 3 seconds first. If you smell burning, see sparks or hear odd noises, stop immediately and don't use it again.</li>
      <li>Then grind a small amount of beans (10 g) and throw it away. After that, use it as normal.</li>
    </ul>
    <p class="small muted">If everything is fine, set the grinder to "Working" in the Pantry tab.</p>
  </div>

  <h2>How to tell the roast</h2>
  <div class="card tips"><ul>
    <li><b>Light:</b> light brown (cinnamon coloured), dry, no oil. Packets say "Light", "Breakfast" or "Filter".</li>
    <li><b>Medium:</b> milk-chocolate brown, dry. Packets say "Medium" or "House blend".</li>
    <li><b>Medium-Dark:</b> dark-chocolate colour, a few oily spots. Packets say "Full City" or "Vienna".</li>
    <li><b>Dark:</b> almost black and shiny with oil all over. Packets say "Dark", "Espresso roast", "French" or "Italian".</li>
  </ul><p class="small muted" style="margin:8px 0 0">Easiest for a moka pot with milk: Medium or Medium-Dark. When you change the roast, the app adjusts grind time, water temperature, heat and when to take it off.</p></div>

  <h2>Grind size</h2>
  <div class="card tips"><p style="margin:0">For a moka pot: <b>like table salt</b>. Coarser than espresso, finer than filter. Ours is a blade grinder (4-point cross blade), so the grind is never perfectly even. Use short pulses, shake it in between, and don't fill it with more than 30 g at once. Running it too long heats the blade and ruins the flavour. Too much powder makes the coffee bitter and muddy.</p></div>

  <h2>Frother tips</h2>
  <div class="card tips"><ul>
    <li>The frother <b>doesn't heat milk</b>, it only makes foam. Heat the milk first.</li>
    <li>For cappuccino, don't fill the pitcher more than 40%. The foam doubles and will overflow.</li>
    <li>Full-cream milk makes the best foam. Low-fat makes more foam, but it's watery.</li>
    <li>Put the frother in the milk before switching it on, or it will splash.</li>
    <li>Speed: thick foam (cappuccino, whipped coffee) = FAST. Silky foam (latte, flat white) = MEDIUM. Click once to turn on, double-click to change speed.</li>
    <li>Charging: a normal 5V phone charger, no more than 2 hours. A fast charger can damage it. Charge it every 3 months even if unused.</li>
    <li>After washing, don't store it with the whisk pointing up, or water runs inside.</li>
    <li>Whipped coffee: 2-4 minutes with the frother, versus 10 minutes by hand.</li>
  </ul></div>

  <h2>New moka pot?</h2>
  <div class="card tips"><p style="margin:0">From the box: before first use, <b>brew 3 times with just water</b> and throw it away. That removes the factory smell and oil. The rubber ring has a front and back: fitted upside down, it leaks.</p></div>

  <h2>Cleaning the moka pot</h2>
  <div class="card tips"><p style="margin:0">Wash with hot water only, <b>no soap</b> (on aluminium it ruins the taste). Let it dry completely before screwing it together. Check the rubber gasket once a month.</p></div>
  <footer>Coffee Ghor · made for home</footer>`;
}

/* ---------- Timer: lives on its step, floats as a pill when you move away ---------- */
let tInt = null, tLeft = 0, tStep = -1, tDone = false;
const fmt = s => `${Math.floor(s/60)}:${String(Math.max(0,s)%60).padStart(2,"0")}`;
function startTimer(sec){
  clearInterval(tInt); tLeft = sec; tStep = S.view === "cook" ? S.step : -1; tDone = false;
  tInt = setInterval(() => {
    tLeft--;
    if (tLeft <= 0){ clearInterval(tInt); tInt = null; tDone = true; beep(); try{ navigator.vibrate && navigator.vibrate([300,150,300]); }catch(e){} }
    paintTimer();
  }, 1000);
  paintTimer();
}
function stopTimer(){ clearInterval(tInt); tInt = null; tStep = -1; tDone = false; paintTimer(); }
function paintTimer(){
  const box = $("#tbox");
  if (box && S.view === "cook" && tStep === S.step){
    box.className = "tbox " + (tDone ? "ding" : "run");
    $("#tbv").textContent = tDone ? "Done" : fmt(tLeft);
    box.querySelector("button").textContent = tDone ? "Start timer" : "Stop timer";
  }
  updateFloat();
}
function updateFloat(){
  const el = $("#timer"), onItsStep = S.view === "cook" && tStep === S.step && !$("#tab-make").classList.contains("hide");
  const active = tInt !== null || tDone;
  el.classList.toggle("show", active && !onItsStep);
  el.classList.toggle("ding", tDone);
  $("#tval").textContent = tDone ? "Time's up! Check it" : fmt(tLeft);
}
function beep(){
  try{ const a = new (window.AudioContext||window.webkitAudioContext)(); [0,0.35,0.7].forEach(t => { const o=a.createOscillator(), g=a.createGain(); o.frequency.value=880; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.2,a.currentTime+t); o.start(a.currentTime+t); o.stop(a.currentTime+t+.2); }); }catch(e){}
}
$("#tstop").onclick = stopTimer;

/* ---------- Events ---------- */
function renderAll(){ renderMake(); renderInv(); }
function showTab(tab){
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  ["make","inv","tips"].forEach(x => $("#tab-"+x).classList.toggle("hide", x !== tab));
  if (tab === "make") renderMake();
  else { document.body.classList.remove("cooking","has-cta"); wakeOff(); updateFloat(); }
  window.scrollTo(0,0);
}
document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.tab){ if (t.dataset.tab === "make" && !$("#tab-make").classList.contains("hide") && S.view === "setup") go("pick"); else showTab(t.dataset.tab); return; }
  if (t.dataset.drink){ S.drink = t.dataset.drink; go("setup"); return; }
  if (t.dataset.go){ go(t.dataset.go); return; }
  if (t.hasAttribute("data-start")){ S.step = 0; go("cook"); return; }
  if (t.hasAttribute("data-again")){ S.step = 0; go("setup"); return; }
  if (t.dataset.nav){ nav(+t.dataset.nav); return; }
  if (t.dataset.lang){ S.lang = t.dataset.lang; save(); renderMake(); return; }
  if (t.dataset.ppl){ S.people = Math.min(20, Math.max(1, S.people + +t.dataset.ppl)); save(); renderMake(); return; }
  const sg = t.closest("[data-seg]");
  if (sg && t.dataset.v){ S[sg.dataset.seg] = t.dataset.v; save(); renderMake(); return; }
  if (t.dataset.timer){ if (tStep === S.step && tInt !== null) stopTimer(); else startTimer(+t.dataset.timer); return; }
  if (t.id === "reset" && confirm("This resets all settings to the defaults. Continue?")){ S = structuredClone(DEFAULTS); save(); renderAll(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.inv){ S.inv[t.dataset.inv] = t.checked; save(); renderMake(); }
  if (t.id === "grinder"){ S.grinder = t.value; save(); renderMake(); }
  if (t.dataset.set){ const v = +t.value; if (v > 0){ S[t.dataset.set] = v; save(); renderMake(); } }
});

// A saved "done" screen is stale on reopen; resume cooking mid-recipe, otherwise start fresh.
if (S.view === "done") S.view = "pick";
renderAll(); renderTips();
</script>
</body>
</html>
