<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coffee Ghor</title>
<meta name="description" content="Our home coffee guide: pick a drink and how many people, get exact amounts and step-by-step instructions.">
<meta name="theme-color" content="#3b2418">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --bg:oklch(96.5% .012 70); --card:oklch(98.8% .006 75); --ink:oklch(24% .03 45); --muted:oklch(50% .03 50); --line:oklch(89% .02 65);
  --brand:oklch(40% .08 45); --brand-ink:oklch(98.5% .005 75); --soft:oklch(93% .022 70);
  --ok:oklch(48% .1 150); --warn:oklch(55% .13 60); --bad:oklch(50% .16 25);
  --c-coffee:oklch(33% .06 45); --c-water:oklch(46% .07 55); --c-milk:oklch(91% .035 80); --c-foam:oklch(98% .01 85); --c-whip:oklch(68% .1 65);
  --radius:14px; --ease:cubic-bezier(.22,1,.36,1);
  --f-display:"Young Serif",Georgia,serif; --f-body:"Atkinson Hyperlegible",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:oklch(18% .015 50); --card:oklch(22% .018 50); --ink:oklch(93% .015 70); --muted:oklch(70% .025 60); --line:oklch(31% .02 50);
    --brand:oklch(74% .09 60); --brand-ink:oklch(18% .015 50); --soft:oklch(27% .022 50);
    --ok:oklch(72% .12 150); --warn:oklch(76% .12 65); --bad:oklch(70% .14 25);
    --c-milk:oklch(86% .03 80); --c-foam:oklch(95% .01 85);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 var(--f-body);padding-bottom:104px;-webkit-font-smoothing:antialiased}
header{padding:28px 16px 4px;max-width:720px;margin:0 auto}
header h1{margin:0;font:400 32px/1.1 var(--f-display);letter-spacing:-.01em}
header p{margin:6px 0 0;color:var(--muted);font-size:16px;max-width:36ch}
main{max-width:720px;margin:0 auto;padding:0 16px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav.tabs button{flex:1;max-width:180px;background:none;border:0;color:var(--muted);font:700 15px var(--f-body);padding:12px 6px;border-radius:10px;cursor:pointer;transition:background .2s var(--ease),color .2s var(--ease)}
nav.tabs button.on{color:var(--brand-ink);background:var(--brand)}
h2{font:400 22px/1.2 var(--f-display);margin:36px 0 12px;display:flex;align-items:baseline;gap:10px}
h2 .num{font:700 13px var(--f-body);color:var(--muted);letter-spacing:.06em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:10px}
.drink{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:12px 12px 14px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:border-color .2s var(--ease),background .2s var(--ease)}
.drink:hover{border-color:var(--muted)}
.drink.on{border-color:var(--brand);background:var(--soft);box-shadow:inset 0 0 0 1px var(--brand)}
.drink svg{width:40px;height:44px;margin-bottom:6px}
.drink b{font-size:16px;line-height:1.25}
.drink small{color:var(--muted);font-size:14px;line-height:1.4}
.drink .state{margin-top:auto;padding-top:8px;font-size:13px;font-weight:700}
.st-ok{color:var(--ok)} .st-no{color:var(--bad)}
.field+.field{margin-top:18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:24px;cursor:pointer}
.stepper output{font:400 30px var(--f-display);min-width:44px;text-align:center}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;color:var(--ink);font:inherit;font-size:15px;padding:10px 10px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:background .2s var(--ease)}
.seg button.on{background:var(--brand);color:var(--brand-ink);font-weight:700}
label.lbl{display:block;font-size:14px;color:var(--muted);margin-bottom:8px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px 12px}
.stat .v{font:400 24px/1.15 var(--f-display)}
.stat .k{font-size:14px;color:var(--muted)}
.note{border-radius:12px;padding:12px 14px;font-size:15px;margin:10px 0}
.n-warn{background:color-mix(in oklch,var(--warn) 14%,var(--bg))}
.n-bad{background:color-mix(in oklch,var(--bad) 13%,var(--bg))}
.n-tip{background:var(--soft)}
.note b{display:block;margin-bottom:2px}
ol.steps{list-style:none;padding:0;margin:0}
ol.steps li{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
ol.steps li:last-child{border-bottom:0}
ol.steps li .n{flex:0 0 34px;height:34px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;cursor:pointer;user-select:none;transition:background .2s var(--ease)}
ol.steps li.done .n{background:var(--ok);border-color:var(--ok);color:var(--brand-ink)}
ol.steps li.done .t{opacity:.5}
ol.steps li.done .t b{text-decoration:line-through}
ol.steps li .t{flex:1}
ol.steps li .t b{display:block;margin-bottom:2px}
ol.steps li .t span{font-size:15px;color:var(--muted)}
.tbtn{margin-top:8px;border:1.5px solid var(--brand);background:none;color:var(--brand);border-radius:99px;padding:6px 14px;font:700 14px var(--f-body);cursor:pointer}
.btn{border:0;background:var(--soft);color:var(--ink);border-radius:12px;padding:14px 16px;font:700 16px var(--f-body);cursor:pointer;width:100%;margin-top:16px}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}
.toggle:last-child{border-bottom:0}
.toggle small{display:block;color:var(--muted);font-size:14px}
.tag{font-size:14px;font-weight:700;color:var(--ok);white-space:nowrap}
.sw{position:relative;width:52px;height:32px;flex:0 0 52px}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:background .2s var(--ease);cursor:pointer}
.sw i:before{content:"";position:absolute;width:26px;height:26px;left:3px;top:3px;background:var(--card);border-radius:50%;transition:transform .2s var(--ease)}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i:before{transform:translateX(20px)}
.sw input:focus-visible+i{outline:2px solid var(--brand);outline-offset:2px}
input[type=number],select{font:inherit;font-size:16px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:120px}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);border-radius:99px;padding:10px 12px 10px 20px;display:none;align-items:center;gap:14px;font-weight:700;font-size:19px;box-shadow:0 8px 28px oklch(0% 0 0 / .25);z-index:20}
.timer.show{display:flex}
.timer.ding{background:var(--ok);color:var(--brand-ink)}
.timer button{background:none;border:1.5px solid currentColor;color:inherit;border-radius:99px;padding:4px 12px;font:700 14px var(--f-body);cursor:pointer}
.tips p,.tips li{font-size:16px}
.tips ul{padding-left:20px;margin:4px 0}
.tips li+li{margin-top:6px}
.muted{color:var(--muted)}
.small{font-size:14px}
.hide{display:none}
button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
footer{text-align:center;margin:32px 0;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header>
  <h1>Coffee Ghor</h1>
  <p>Pick a drink and how many people. The app works out the amounts and the steps.</p>
</header>

<main>
  <section id="tab-make"></section>
  <section id="tab-inv" class="hide"></section>
  <section id="tab-tips" class="hide"></section>
</main>

<div class="timer" id="timer" role="status"><span id="tval">0:00</span><button id="tstop">Stop</button></div>

<nav class="tabs">
  <button data-tab="make" class="on">Make</button>
  <button data-tab="inv">Pantry</button>
  <button data-tab="tips">Tips</button>
</nav>

<script>
/* ---------- State ---------- */
// Keys (halka/kora, kom/beshi) are kept from v1 so saved settings on phones still load.
const DEFAULTS = {
  drink: "cappuccino", people: 2, strength: "normal", sweet: "normal", source: "auto", roast: "medium",
  grinder: "ok",                  // ok | check | broken
  mokaWater: 300,                 // ml, 6-cup pot, just below the valve
  mokaCoffee: 28,                 // g per brew, 6-cup basket filled level
  yieldPct: 88,                   // % of water that comes out as coffee
  pitcher: 350,
  inv: { beans:true, ground:false, instant:false, milk:true, sugar:true, cocoa:false, ice:false, condensed:false }
};
const KEY = "coffee-ghor-v1";
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s) return {...DEFAULTS, ...s, inv:{...DEFAULTS.inv, ...(s.inv||{})}}; }catch(e){} return structuredClone(DEFAULTS); }
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- Recipes (per person) ---------- */
// coffee: moka coffee ml, water: hot water ml, milk: ml, milkMode: hot|cold|boil, froth: thick|light|none
const RECIPES = [
  { id:"moka", name:"Espresso", desc:"Strong and black, in a small cup. Made in the moka pot.", coffee:50, water:0, milk:0, froth:"none" },
  { id:"americano", name:"Americano", desc:"Espresso topped up with hot water. Lighter black coffee.", coffee:60, water:120, milk:0, froth:"none" },
  { id:"cappuccino", name:"Cappuccino", desc:"Espresso, hot milk and a thick layer of foam.", coffee:60, water:0, milk:100, milkMode:"hot", froth:"thick" },
  { id:"latte", name:"Latte", desc:"Lots of milk, a thin layer of foam. Mild and creamy.", coffee:60, water:0, milk:180, milkMode:"hot", froth:"light" },
  { id:"flatwhite", name:"Flat White", desc:"More coffee, less milk, smooth silky foam.", coffee:70, water:0, milk:110, milkMode:"hot", froth:"light" },
  { id:"mocha", name:"Mocha", desc:"A latte with chocolate. For a sweet tooth.", coffee:60, water:0, milk:150, milkMode:"hot", froth:"light", cocoa:1 },
  { id:"doodh", name:"Café au Lait", desc:"Coffee stirred into boiled, sweetened milk. Home style.", coffee:45, water:0, milk:160, milkMode:"boil", froth:"light", condensedOpt:true },
  { id:"icedlatte", name:"Iced Latte", desc:"Espresso, cold milk and ice. For hot days.", coffee:60, water:0, milk:150, milkMode:"cold", froth:"none", ice:5 },
  { id:"icedmocha", name:"Iced Mocha", desc:"An iced latte with chocolate.", coffee:60, water:0, milk:150, milkMode:"cold", froth:"none", ice:5, cocoa:1 },
  { id:"dalgona", name:"Whipped Coffee", desc:"Whipped instant coffee on cold milk. No moka pot needed.", coffee:0, instant:1, water:0, milk:200, milkMode:"cold", froth:"none", ice:4 }
];
const STRENGTH = { halka:0.75, normal:1, kora:1.3 };
const STRENGTH_LBL = { halka:"Mild", normal:"Normal", kora:"Strong" };
const SWEET = { none:0, kom:1, normal:2, beshi:3 };
const SWEET_LBL = { none:"No sugar", kom:"Less", normal:"Normal", beshi:"More" };
// Per roast: grind time, water temp, heat, when to take off. Dose stays the same: the basket is always filled level.
const ROASTS = {
  light:  { lbl:"Light", pulse:"about 15-18 seconds in total. Light beans are hard, so grind a little finer.", water:"Bring it to a full boil. Light roasts need more heat to bring out the flavour.", heat:"medium", pull:"Let light roasts run a little longer, but take it off as soon as it starts gurgling.",
            black:"Light roast is best black: fruity, slightly sour.", milk:"Light roast gets lost in milk. Pick \"Strong\", or try Espresso or Americano." },
  medium: { lbl:"Medium", pulse:"about 12-15 seconds in total.", water:"Heat until just before it boils.", heat:"medium-low", pull:"",
            black:"Medium roast: balanced, good black.", milk:"Medium roast: balanced, good with milk." },
  mdark:  { lbl:"Medium-Dark", pulse:"about 10-12 seconds in total.", water:"Heat until just before it boils.", heat:"medium-low", pull:"Take it off as soon as the stream starts turning pale.",
            black:"Medium-dark can taste a bit bitter black. Try \"Mild\" strength.", milk:"Medium-dark with milk is a perfect match. Chocolatey." },
  dark:   { lbl:"Dark", pulse:"about 8-10 seconds in total. Dark beans are soft and grind fast. Too long turns them to powder and makes it bitter.", water:"Boil, then let it cool for 1 minute before pouring.", heat:"low", pull:"Take dark roasts off EARLY, as soon as the stream turns pale. Dark roasts go bitter fast.",
            black:"Dark roast is very bitter black. Add more water to the Americano, or pick \"Mild\".", milk:"Dark roast is best with milk and chocolate. The milk hides the bitterness." },
  unknown:{ lbl:"Not sure", pulse:"about 12-15 seconds in total.", water:"Heat until just before it boils.", heat:"medium-low", pull:"",
            black:"Roast unknown, so the app assumes medium. See \"How to tell the roast\" in Tips.", milk:"Roast unknown, so the app assumes medium. See \"How to tell the roast\" in Tips." }
};
const BLACK = ["moka","americano"];
const roast = () => ROASTS[S.roast] || ROASTS.medium;
const INV_LBL = {
  beans:["Whole coffee beans","Need the grinder"],
  ground:["Ground coffee","Works even if the grinder is broken"],
  instant:["Instant coffee","For Whipped Coffee"],
  milk:["Milk","Full-cream milk makes the best foam"],
  sugar:["Sugar",""],
  cocoa:["Cocoa powder or chocolate","For Mocha"],
  ice:["Ice","For iced drinks"],
  condensed:["Condensed milk","Optional, for Café au Lait"]
};
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

/* ---------- Cup illustration: layers drawn to the recipe's real proportions ---------- */
function cup(r){
  const W = 40, H = 44, top = 4, bot = 40, inner = bot - top;
  const L = [];
  if (r.instant){ L.push(["--c-milk", r.milk], ["--c-whip", 60]); }
  else {
    if (r.coffee) L.push([r.water ? "--c-water" : "--c-coffee", r.coffee + r.water]);
    if (r.milk){
      const foam = r.froth === "thick" ? .4 : r.froth === "light" ? .15 : 0;
      L.push(["--c-milk", r.milk * (1 - foam)]);
      if (foam) L.push(["--c-foam", r.milk * foam]);
    }
  }
  const total = L.reduce((a, [, v]) => a + v, 0), fill = Math.min(1, total / 260);
  let y = bot, rects = "";
  for (const [c, v] of L){
    const h = inner * fill * v / total; y -= h;
    rects += `<rect x="0" y="${y.toFixed(1)}" width="${W}" height="${h.toFixed(1)}" fill="var(${c})"/>`;
  }
  if (r.ice) rects += [[8, bot - 12], [20, bot - 20], [13, bot - 27]].map(([x, yy]) => `<rect x="${x}" y="${yy}" width="9" height="9" rx="2" fill="none" stroke="var(--card)" stroke-width="1.5" opacity=".8"/>`).join("");
  const path = `M6 ${top} L34 ${top} L31 ${bot} Q30.5 ${bot + 2} 28 ${bot + 2} L12 ${bot + 2} Q9.5 ${bot + 2} 9 ${bot} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><defs><clipPath id="c-${r.id}"><path d="${path}"/></clipPath></defs>
    <g clip-path="url(#c-${r.id})">${rects}</g><path d="${path}" fill="none" stroke="var(--muted)" stroke-width="1.5"/></svg>`;
}

/* ---------- Logic ---------- */
const grinderOk = () => S.grinder === "ok";
function coffeeSource(){
  const beansOk = S.inv.beans && grinderOk();
  if (S.source === "beans" && beansOk) return "beans";
  if (S.source === "ground" && S.inv.ground) return "ground";
  if (beansOk) return "beans";
  if (S.inv.ground) return "ground";
  return null;
}
function missing(r){
  const m = [];
  if (r.coffee > 0 && !coffeeSource()){
    if (S.inv.beans && !grinderOk()) m.push("a working grinder (or ground coffee)");
    else m.push("coffee (beans or ground)");
  }
  if (r.instant && !S.inv.instant) m.push("instant coffee");
  if (r.instant && !S.inv.sugar) m.push("sugar (needed for whipping)");
  if (r.milk > 0 && !S.inv.milk) m.push("milk");
  if (r.cocoa && !S.inv.cocoa) m.push("cocoa or chocolate");
  if (r.ice && !S.inv.ice) m.push("ice");
  return m;
}
function plan(r){
  const n = S.people, f = STRENGTH[S.strength];
  const p = { n };
  p.coffeePer = Math.round(r.coffee * f);
  // Mild americano: less coffee, more water, same cup size
  p.waterPer = r.water ? Math.round(r.water + r.coffee - p.coffeePer) : 0;
  p.coffeeTotal = p.coffeePer * n;
  p.yieldPerBrew = Math.round(S.mokaWater * S.yieldPct / 100);
  p.brews = p.coffeeTotal > 0 ? Math.ceil(p.coffeeTotal / p.yieldPerBrew) : 0;
  p.grams = p.brews * S.mokaCoffee;
  p.tbsp = Math.round(p.grams / 5.5);
  p.milkPer = r.milk; p.milkTotal = r.milk * n;
  const cap = r.froth === "thick" ? Math.round(S.pitcher * 0.43) : Math.round(S.pitcher * 0.57); // 350 pitcher: 150 / 200 mark
  p.frothCap = cap;
  p.frothBatches = r.froth !== "none" && p.milkTotal ? Math.ceil(p.milkTotal / cap) : 0;
  p.sugarTsp = r.instant ? 0 : SWEET[S.sweet] * n;
  p.cocoaTbsp = (r.cocoa || 0) * n;
  p.ice = (r.ice || 0) * n;
  p.instantTbsp = r.instant ? Math.max(2, r.instant * n) : 0;
  p.hotWaterTotal = p.waterPer * n;
  // Time: ~8 min per brew + 3 min cool/refill between brews, + 4 min prep
  p.minutes = r.instant ? 6 + Math.ceil(n/2) : p.brews * 8 + Math.max(0, p.brews - 1) * 3 + 4 + (p.frothBatches > 1 ? p.frothBatches - 1 : 0);
  return p;
}

function buildSteps(r, p){
  const s = [];
  const src = coffeeSource();
  if (r.instant){
    s.push({ t:"Make the coffee cream", d:`In the pitcher: ${p.instantTbsp} tbsp instant coffee, ${p.instantTbsp} tbsp sugar and ${p.instantTbsp} tbsp hot water. Equal amounts of each.` });
    s.push({ t:"Whip it with the frother", d:"FAST speed, 2 to 4 minutes. It turns light brown and thick, and won't fall off an upside-down spoon. Take a short break if your hand gets tired.", timer:180 });
    s.push({ t:"Fill the glasses", d:`${r.ice} ice cubes and ${p.milkPer} ml cold milk in each glass. For extra sweetness, stir a little sugar into the milk first.` });
    s.push({ t:"Spoon the cream on top", d:"Spoon the whipped coffee over the milk. Stir it in before drinking." });
    return s;
  }
  if (src === "beans"){
    s.push({ t:`Grind the beans: ${p.grams} g (about ${p.tbsp} tbsp)`, d:`${roast().lbl} roast: short 3-4 second pulses, ${roast().pulse} Shake the grinder between pulses. Aim for the texture of table salt. Powder-fine makes moka coffee bitter and can clog the filter.` });
  } else {
    s.push({ t:`Measure the ground coffee: ${p.grams} g (about ${p.tbsp} tbsp)`, d:"Pre-ground coffee loses flavour fast. Keep the packet sealed tight." });
  }
  const hotWater = p.brews * S.mokaWater + p.hotWaterTotal;
  s.push({ t:`Heat about ${hotWater} ml water in the kettle`, d:`${roast().water} Starting with hot water means the pot spends less time on the stove, so the coffee doesn't burn or turn bitter.` });
  if ((r.milkMode === "hot" || r.milkMode === "boil") && p.milkTotal){
    s.push({ t:`Heat all the milk at once: ${p.milkTotal} ml`, d: r.milkMode === "boil"
      ? "Bring the milk to a boil once, then turn the heat down. You can add the sugar to the milk now."
      : "Steaming, with small bubbles at the edge, but NOT boiling (about 65°C). Too hot and it won't foam, and it loses its sweetness." });
  }
  const multi = p.brews > 1 ? ` (brew 1 of ${p.brews})` : "";
  s.push({ t:`Pour hot water into the moka base${multi}`, d:`Fill to just below the safety valve (about ${S.mokaWater} ml). Never cover the valve. The base is hot: hold it with a cloth.` });
  s.push({ t:`Put ${S.mokaCoffee} g coffee in the filter basket`, d:"Fill it level. Do NOT press it down. Wipe any grounds off the rim, or it will leak." });
  s.push({ t:`Screw the pot together, put it on ${roast().heat} heat`, d:"Hold the base with a cloth and screw it on tight. Leave the lid open so you can watch." });
  s.push({ t:"Watch the coffee come out", d:`It should flow slowly, like honey. As soon as it turns pale yellow or starts gurgling, take it off the heat RIGHT AWAY. The last bit is bitter. ${roast().pull}`, timer:300 });
  s.push({ t:"Cool the base under cold water for 5 seconds", d:"This stops the brewing so it doesn't turn bitter. Pour the coffee into a warm jug or flask and stir." });
  if (p.brews > 1){
    s.push({ t:`Brew ${plural(p.brews - 1, "more time", "more times")}`, d:"Cool the pot, throw out the old grounds and rinse it, then repeat from \"Pour hot water into the moka base\". Keep the earlier coffee covered in the flask. Get the milk ready meanwhile." });
  }
  if (r.froth !== "none" && p.milkTotal){
    const bt = p.frothBatches > 1 ? ` (${p.frothBatches} batches, max ${p.frothCap} ml each)` : "";
    s.push(r.froth === "thick"
      ? { t:`Froth the milk${bt}`, d:"Hot milk in the pitcher, up to the 150 mark (no more). Frother on FAST (double-click the button to change speed). Hold it near the top of the milk for 15-20 seconds to pull in air, then lower it for 10 seconds. The foam will double. Tap the pitcher on the counter 2-3 times to pop big bubbles.", timer:30 }
      : { t:`Froth the milk${bt}`, d:"Milk in the pitcher, between the 150 and 250 marks. Frother on MEDIUM, fully under the surface, 10-15 seconds. You want silky, tiny bubbles, not stiff foam. Swirl the pitcher to mix.", timer:15 });
  }
  const sw = SWEET[S.sweet];
  const sugarLine = sw ? ` Stir ${plural(sw, "teaspoon", "teaspoons")} of sugar into each cup while the coffee is hot.` : "";
  switch (r.id){
    case "moka": s.push({ t:`Serve ${p.coffeePer} ml per cup`, d:`Pour into small cups.${sugarLine}` }); break;
    case "americano": s.push({ t:"Serve", d:`Pour ${p.waterPer} ml hot water into each cup first, then ${p.coffeePer} ml coffee.${sugarLine}` }); break;
    case "cappuccino": s.push({ t:"Put it together", d:`${p.coffeePer} ml coffee in each cup.${sugarLine} Hold back the foam with a spoon and pour the milk, then spoon the foam on top. Dust with cocoa if you like.` }); break;
    case "latte":
    case "flatwhite": s.push({ t:"Put it together", d:`${p.coffeePer} ml coffee in each cup.${sugarLine} Then pour ${p.milkPer} ml frothed milk slowly into the middle.` }); break;
    case "mocha": s.push({ t:"Make the chocolate paste, then put it together", d:`In each cup, mix ${r.cocoa} tbsp cocoa, the sugar and 2 spoons of hot coffee into a smooth paste (no lumps). Then add the rest of the coffee, then ${p.milkPer} ml milk.` }); break;
    case "doodh": s.push({ t:"Mix and serve", d:`Pour the coffee into the hot milk (${p.coffeePer} ml coffee and ${p.milkPer} ml milk per cup).${sugarLine}${S.inv.condensed ? " A spoon of condensed milk makes it extra creamy." : ""} A little foam on top.` }); break;
    case "icedlatte":
    case "icedmocha": s.push({ t:"Build it in the glass", d:`${r.cocoa ? "Stir the cocoa and sugar into the hot coffee. " : (sw ? "Stir the sugar into the hot coffee FIRST, it won't dissolve in cold. " : "")}${r.ice} ice cubes in each glass, ${p.coffeePer} ml coffee, then ${p.milkPer} ml cold milk. Let the coffee cool a bit first so the ice melts less.` }); break;
  }
  return s;
}

/* ---------- Render: Make ---------- */
const $ = (sel, el=document) => el.querySelector(sel);
function seg(name, opts, cur){
  return `<div class="seg" data-seg="${name}">${Object.entries(opts).map(([k,v]) => `<button data-v="${k}" class="${k===cur?"on":""}">${v}</button>`).join("")}</div>`;
}
const head = (n, txt) => `<h2><span class="num">${n}</span>${txt}</h2>`;
function renderMake(){
  const r = RECIPES.find(x => x.id === S.drink) || RECIPES[0];
  const miss = missing(r), p = plan(r), src = coffeeSource();
  const canBoth = S.inv.beans && grinderOk() && S.inv.ground;
  let h = head("01", "Choose a drink") + `<div class="grid">` + RECIPES.map(x => {
    const m = missing(x);
    return `<button class="drink ${x.id===r.id?"on":""}" data-drink="${x.id}">${cup(x)}<b>${x.name}</b><small>${x.desc}</small>
      <span class="state ${m.length?"st-no":"st-ok"}">${m.length?"Missing "+plural(m.length,"item","items"):"Ready to make"}</span></button>`;
  }).join("") + `</div>`;

  h += head("02", "How many, and how?") + `<div class="card">
    <div class="field row"><label class="lbl" style="margin:0">People</label>
      <div class="stepper"><button data-ppl="-1" aria-label="Fewer people">−</button><output>${S.people}</output><button data-ppl="1" aria-label="More people">+</button></div></div>
    ${r.instant ? "" : `<div class="field"><label class="lbl">Strength</label>${seg("strength", STRENGTH_LBL, S.strength)}</div>`}
    ${r.coffee ? `<div class="field"><label class="lbl">Bean roast</label>${seg("roast", Object.fromEntries(Object.entries(ROASTS).map(([k,v]) => [k,v.lbl])), S.roast)}</div>` : ""}
    ${r.instant ? "" : `<div class="field"><label class="lbl">Sugar</label>${seg("sweet", SWEET_LBL, S.sweet)}</div>`}
    ${canBoth && r.coffee ? `<div class="field"><label class="lbl">Which coffee</label>${seg("source", {auto:"Auto",beans:"Grind beans",ground:"Ground coffee"}, S.source)}</div>` : ""}
  </div>`;

  h += head("03", `${r.name} for ${plural(S.people, "person", "people")}`);
  if (miss.length){
    h += `<div class="note n-bad"><b>Can't make this yet.</b> You need: ${miss.join(", ")}. Update the Pantry tab, or pick another drink.</div>`;
  }
  if (r.coffee && S.grinder !== "ok" && S.inv.beans){
    h += `<div class="note n-warn"><b>The grinder hasn't been checked.</b> Running it after salt-water exposure risks a short circuit or rust. There's a checklist in Tips. Use ground coffee until then.</div>`;
  }
  if (p.brews >= 3){
    h += `<div class="note n-warn"><b>${p.brews} moka brews, about ${p.minutes} minutes.</b> One pot makes at most ${p.yieldPerBrew} ml at a time. To save time, pick "Mild" strength, or give half the group an Americano.</div>`;
  }
  if (r.coffee){
    const ro = roast(), txt = BLACK.includes(r.id) ? ro.black : ro.milk;
    h += `<div class="note n-tip"><b>${ro.lbl} roast in a ${r.name}</b>${txt}</div>`;
  }
  const st = [];
  if (r.instant){
    st.push([p.instantTbsp+" tbsp","Instant coffee"],[p.instantTbsp+" tbsp","Sugar"],[p.instantTbsp+" tbsp","Hot water"]);
  } else {
    st.push([p.brews+"×","Moka brews"],[p.grams+" g","Coffee (about "+p.tbsp+" tbsp)"],[p.coffeeTotal+" ml","Brewed coffee"]);
    if (p.hotWaterTotal) st.push([p.hotWaterTotal+" ml","Extra hot water"]);
  }
  if (p.milkTotal) st.push([p.milkTotal+" ml","Milk"]);
  if (p.frothBatches) st.push([p.frothBatches+"×","Frothing batches"]);
  if (p.sugarTsp) st.push([p.sugarTsp+" tsp","Sugar"]);
  if (p.cocoaTbsp) st.push([p.cocoaTbsp+" tbsp","Cocoa"]);
  if (p.ice) st.push([p.ice,"Ice cubes"]);
  st.push(["~"+p.minutes+" min","Total time"]);
  h += `<div class="card"><div class="stats">${st.map(([v,k]) => `<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`).join("")}</div>
    ${r.coffee ? `<p class="small muted" style="margin:14px 0 0">Per person: ${p.coffeePer} ml coffee${p.milkPer?`, ${p.milkPer} ml milk`:""}${p.waterPer?`, ${p.waterPer} ml water`:""}. Using: ${src==="beans"?"freshly ground beans":src==="ground"?"ground coffee":"none available"}.</p>` : ""}</div>`;

  const steps = buildSteps(r, p);
  h += head("04", "Step by step") + `<div class="card"><p class="small muted" style="margin:0 0 4px">Tap a number to mark the step done.</p><ol class="steps">` +
    steps.map((x,i) => `<li><div class="n" data-done role="button" aria-label="Mark step ${i+1} done">${i+1}</div><div class="t"><b>${x.t}</b><span>${x.d}</span>${x.timer?`<br><button class="tbtn" data-timer="${x.timer}">Start ${fmt(x.timer)} timer</button>`:""}</div></li>`).join("") +
    `</ol></div>`;
  $("#tab-make").innerHTML = h;
}

/* ---------- Render: Pantry ---------- */
function renderInv(){
  const g = {ok:"Working", check:"Needs checking", broken:"Broken"};
  let h = `<h2>Equipment</h2><div class="card">
    <div class="toggle"><div><b>Moka pot</b><small>6-cup stovetop, about 300 ml. The rubber ring has a front and back: don't fit it upside down.</small></div><span class="tag">Have it</span></div>
    <div class="toggle"><div><b>Electric grinder</b><small>Blade grinder (NS-2026, 220V). If anything seems wrong, set it to "Needs checking".</small></div>
      <select id="grinder" aria-label="Grinder status">${Object.entries(g).map(([k,v]) => `<option value="${k}" ${S.grinder===k?"selected":""}>${v}</option>`).join("")}</select></div>
    <div class="toggle"><div><b>Milk pitcher</b><small>Stainless steel, with 150 / 250 / 350 ml marks inside</small></div><span class="tag">${S.pitcher} ml</span></div>
    <div class="toggle"><div><b>Enjoy milk frother</b><small>3 speeds (double-click to change), USB-C. Don't use a fast charger.</small></div><span class="tag">Have it</span></div>
  </div>
  <h2>What's in the kitchen?</h2><div class="card">` +
  Object.entries(INV_LBL).map(([k,[l,d]]) => `<div class="toggle"><div><b>${l}</b>${d?`<small>${d}</small>`:""}</div>
    <label class="sw"><input type="checkbox" data-inv="${k}" ${S.inv[k]?"checked":""} aria-label="${l}"><i></i></label></div>`).join("") +
  `</div>
  <h2>Moka pot settings</h2><div class="card">
    <p class="small muted" style="margin-top:0">Measure once with a measuring cup and enter the numbers here. Every amount in the app is based on these.</p>
    <div class="toggle"><div><b>Water in the base</b><small>Up to just below the valve, ml</small></div><input type="number" min="50" max="600" data-set="mokaWater" value="${S.mokaWater}"></div>
    <div class="toggle"><div><b>Coffee in the basket</b><small>Filled level, grams</small></div><input type="number" min="5" max="60" data-set="mokaCoffee" value="${S.mokaCoffee}"></div>
    <div class="toggle"><div><b>Coffee yield</b><small>% of the water that comes out as coffee, usually 80-90</small></div><input type="number" min="50" max="100" data-set="yieldPct" value="${S.yieldPct}"></div>
    <div class="toggle"><div><b>Pitcher size</b><small>ml</small></div><input type="number" min="150" max="1000" data-set="pitcher" value="${S.pitcher}"></div>
  </div>
  <button class="btn" id="reset">Reset everything to defaults</button>`;
  $("#tab-inv").innerHTML = h;
}

/* ---------- Render: Tips ---------- */
function renderTips(){
  $("#tab-tips").innerHTML = `
  <h2>5 rules for great coffee</h2>
  <div class="card tips"><ul>
    <li><b>Fresh beans, fresh grind.</b> Brew within 15 minutes of grinding. Keep beans in an airtight jar, out of the sun, not in the fridge.</li>
    <li><b>Hot water in the moka pot.</b> Cold water keeps the pot on the stove too long and burns the coffee.</li>
    <li><b>Don't press the coffee down.</b> Just fill the basket level. Pressing it raises the pressure: bitter, and a safety risk.</li>
    <li><b>Take it off early.</b> Remove it as soon as you hear gurgling or see the stream go pale. The last part is the most bitter.</li>
    <li><b>Don't boil the milk</b> for lattes and cappuccinos. Aim for 60-65°C: too hot to hold the pitcher for more than 3 seconds.</li>
  </ul></div>

  <h2>Grinder safety check</h2>
  <div class="card tips">
    <p style="margin-top:0">Salt water can cause short circuits and rust in electrical things. Don't plug it in until you've done this:</p>
    <ul>
      <li>Unplug it and wipe the blade and chamber with a tissue. If there are white salt marks, wipe with a slightly damp cloth, then a dry one.</li>
      <li>Leave it to dry for at least 48 hours somewhere airy. Longer if water got into the motor vents.</li>
      <li>Check the cord and plug pins for black or green marks (corrosion). If you see any, don't use it.</li>
      <li>Run it empty for 3 seconds first. If you smell burning, see sparks or hear odd noises, stop immediately and don't use it again.</li>
      <li>Then grind a small amount of beans (10 g) and throw it away. After that, use it as normal.</li>
    </ul>
    <p class="small muted">If everything is fine, set the grinder to "Working" in the Pantry tab.</p>
  </div>

  <h2>How to tell the roast</h2>
  <div class="card tips"><ul>
    <li><b>Light:</b> light brown (cinnamon coloured), dry, no oil. Packets say "Light", "Breakfast" or "Filter".</li>
    <li><b>Medium:</b> milk-chocolate brown, dry. Packets say "Medium" or "House blend".</li>
    <li><b>Medium-Dark:</b> dark-chocolate colour, a few oily spots. Packets say "Full City" or "Vienna".</li>
    <li><b>Dark:</b> almost black and shiny with oil all over. Packets say "Dark", "Espresso roast", "French" or "Italian".</li>
  </ul><p class="small muted" style="margin:8px 0 0">Easiest for a moka pot with milk: Medium or Medium-Dark. When you change the roast, the app adjusts grind time, water temperature, heat and when to take it off.</p></div>

  <h2>Grind size</h2>
  <div class="card tips"><p style="margin:0">For a moka pot: <b>like table salt</b>. Coarser than espresso, finer than filter. Ours is a blade grinder (4-point cross blade), so the grind is never perfectly even. Use short pulses, shake it in between, and don't fill it with more than 30 g at once. Running it too long heats the blade and ruins the flavour. Too much powder makes the coffee bitter and muddy.</p></div>

  <h2>Frother tips</h2>
  <div class="card tips"><ul>
    <li>The frother <b>doesn't heat milk</b>, it only makes foam. Heat the milk first.</li>
    <li>For cappuccino, don't fill the pitcher more than 40%. The foam doubles and will overflow.</li>
    <li>Full-cream milk makes the best foam. Low-fat makes more foam, but it's watery.</li>
    <li>Put the frother in the milk before switching it on, or it will splash.</li>
    <li>Speed: thick foam (cappuccino, whipped coffee) = FAST. Silky foam (latte, flat white) = MEDIUM. Click once to turn on, double-click to change speed.</li>
    <li>Charging: a normal 5V phone charger, no more than 2 hours. A fast charger can damage it. Charge it every 3 months even if unused.</li>
    <li>After washing, don't store it with the whisk pointing up, or water runs inside.</li>
    <li>Whipped coffee: 2-4 minutes with the frother, versus 10 minutes by hand.</li>
  </ul></div>

  <h2>New moka pot?</h2>
  <div class="card tips"><p style="margin:0">From the box: before first use, <b>brew 3 times with just water</b> and throw it away. That removes the factory smell and oil. The rubber ring has a front and back: fitted upside down, it leaks.</p></div>

  <h2>Cleaning the moka pot</h2>
  <div class="card tips"><p style="margin:0">Wash with hot water only, <b>no soap</b> (on aluminium it ruins the taste). Let it dry completely before screwing it together. Check the rubber gasket once a month.</p></div>
  <footer>Coffee Ghor · made for home</footer>`;
}

/* ---------- Timer ---------- */
let tInt = null, tLeft = 0;
const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
function startTimer(sec){
  clearInterval(tInt); tLeft = sec;
  const el = $("#timer"); el.classList.add("show"); el.classList.remove("ding"); $("#tval").textContent = fmt(tLeft);
  tInt = setInterval(() => {
    tLeft--; $("#tval").textContent = fmt(Math.max(0,tLeft));
    if (tLeft <= 0){ clearInterval(tInt); el.classList.add("ding"); $("#tval").textContent = "Time's up! Check it"; beep(); try{ navigator.vibrate && navigator.vibrate([300,150,300]); }catch(e){} }
  }, 1000);
}
function beep(){
  try{ const a = new (window.AudioContext||window.webkitAudioContext)(); [0,0.35,0.7].forEach(t => { const o=a.createOscillator(), g=a.createGain(); o.frequency.value=880; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.2,a.currentTime+t); o.start(a.currentTime+t); o.stop(a.currentTime+t+.2); }); }catch(e){}
}
$("#tstop").onclick = () => { clearInterval(tInt); $("#timer").classList.remove("show","ding"); };

/* ---------- Events ---------- */
function renderAll(){ renderMake(); renderInv(); }
document.addEventListener("click", e => {
  const t = e.target.closest("button,[data-done]");
  if (!t) return;
  if (t.dataset.tab){
    document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b === t));
    ["make","inv","tips"].forEach(x => $("#tab-"+x).classList.toggle("hide", x !== t.dataset.tab));
    if (t.dataset.tab === "make") renderMake();
    window.scrollTo(0,0); return;
  }
  if (t.dataset.drink){ S.drink = t.dataset.drink; save(); renderMake(); return; }
  if (t.dataset.ppl){ S.people = Math.min(20, Math.max(1, S.people + +t.dataset.ppl)); save(); renderMake(); return; }
  const sg = t.closest("[data-seg]");
  if (sg && t.dataset.v){ S[sg.dataset.seg] = t.dataset.v; save(); renderMake(); return; }
  if (t.dataset.timer){ startTimer(+t.dataset.timer); return; }
  if (t.hasAttribute("data-done")){ t.closest("li").classList.toggle("done"); return; }
  if (t.id === "reset" && confirm("This resets all settings to the defaults. Continue?")){ S = structuredClone(DEFAULTS); save(); renderAll(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.inv){ S.inv[t.dataset.inv] = t.checked; save(); renderMake(); }
  if (t.id === "grinder"){ S.grinder = t.value; save(); renderMake(); }
  if (t.dataset.set){ const v = +t.value; if (v > 0){ S[t.dataset.set] = v; save(); renderMake(); } }
});

renderAll(); renderTips();
</script>
